<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG LUYỆN TẬP HỌC KỲ II</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* --- CSS CHUNG --- */
        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
            transition: background-color 0.5s, color 0.5s;
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        
        .hidden { display: none !important; }

        /* Hiển thị phân số đứng */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            vertical-align: middle;
            margin: 0 5px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .numerator {
            border-bottom: 2px solid currentColor;
            padding: 0 4px;
        }
        .denominator {
            padding: 0 4px;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            border: none;
        }

        .form-check {
            margin-bottom: 12px;
            padding: 10px 15px 10px 35px;
            border-radius: 10px;
            transition: background-color 0.2s;
        }
        .form-check-label {
            cursor: pointer;
            font-size: 1.1rem;
            vertical-align: middle;
        }

        .question-title {
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .header-banner {
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }

        /* --- THEME 1: TRANG CHỦ --- */
        .theme-landing {
            background-color: #f8f9fa;
            color: #333;
        }
        .landing-box {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .btn-huge {
            font-size: 1.5rem;
            padding: 15px 50px;
            border-radius: 50px;
            margin: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .btn-huge:hover { transform: translateY(-5px); }
        .btn-g4 { background-color: #4caf50; color: #fff; border: 2px solid #4caf50; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-g4:hover { background-color: white; color: #4caf50; }
        .btn-g5 { background-color: #9c27b0; color: #fff; border: 2px solid #9c27b0; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-g5:hover { background-color: white; color: #9c27b0; }

        /* --- THEME 2: XANH LỤC SÁNG (LỚP 4) --- */
        .theme-green-g4 {
            background-color: #e8f5e9;
            color: #1b5e20;
        }
        .theme-green-g4 .header-banner { background: linear-gradient(135deg, #66bb6a, #81c784); color: #fff; }
        .theme-green-g4 .card { background-color: #ffffff; }
        .theme-green-g4 .card-header { background-color: #c8e6c9; color: #2e7d32; font-size: 1.25rem; font-weight: bold; border-radius: 20px 20px 0 0; padding: 15px 20px;}
        .theme-green-g4 .question-title { color: #2e7d32; }
        .theme-green-g4 .form-check:hover { background-color: #e8f5e9; }
        .theme-green-g4 input.form-control { border: 2px solid #c8e6c9; border-radius: 10px; margin-bottom: 10px; }
        .theme-green-g4 input.form-control:focus { border-color: #4caf50; box-shadow: 0 0 0 0.25rem rgba(76, 175, 80, 0.25); }
        .theme-green-g4 .essay-step { background-color: #f1f8e9; border-left: 5px solid #4caf50; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .theme-green-g4 .btn-submit { background-color: #4caf50; color: white; font-weight: bold; border-radius: 30px; padding: 12px 40px; font-size: 1.2rem; border: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); transition: all 0.3s; }
        .theme-green-g4 .btn-submit:hover { background-color: #388e3c; transform: translateY(-2px); }
        .theme-green-g4 .fraction { color: #2e7d32; }

        /* --- THEME 3: TÍM SÁNG (LỚP 5) --- */
        .theme-purple-g5 {
            background-color: #f3e5f5;
            color: #4a148c;
        }
        .theme-purple-g5 .header-banner { background: linear-gradient(135deg, #ab47bc, #ce93d8); color: white; }
        .theme-purple-g5 .card { background-color: #ffffff; }
        .theme-purple-g5 .card-header { background-color: #e1bee7; color: #6a1b9a; font-size: 1.25rem; font-weight: bold; border-radius: 20px 20px 0 0; padding: 15px 20px;}
        .theme-purple-g5 .question-title { color: #8e24aa; }
        .theme-purple-g5 .form-check:hover { background-color: #f3e5f5; }
        .theme-purple-g5 input.form-control { border: 2px solid #e1bee7; border-radius: 10px; margin-bottom: 10px; }
        .theme-purple-g5 input.form-control:focus { border-color: #ab47bc; box-shadow: 0 0 0 0.25rem rgba(171, 71, 188, 0.25); }
        .theme-purple-g5 .essay-step { background-color: #faf0e6; border-left: 5px solid #ab47bc; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        .theme-purple-g5 .btn-submit { background-color: #ab47bc; color: white; font-weight: bold; border-radius: 30px; padding: 12px 40px; font-size: 1.2rem; border: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); transition: all 0.3s; }
        .theme-purple-g5 .btn-submit:hover { background-color: #8e24aa; transform: translateY(-2px); }
        .theme-purple-g5 .fraction { color: #6a1b9a; }
    </style>
</head>
<body class="theme-landing" id="mainBody">

    <div id="landingView" class="landing-box">
        <h1 class="mb-5 fw-bold text-center" style="font-size: 3rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);">CHỌN BÀI KIỂM TRA</h1>
        <div>
            <button class="btn btn-huge btn-g4" onclick="startExam(4)">Lớp 4</button>
            <button class="btn btn-huge btn-g5" onclick="startExam(5)">Lớp 5</button>
        </div>
    </div>

    <div id="examView" class="container mt-5 mb-5 hidden">
        <div class="header-banner">
            <h1 id="examTitle" class="fw-bold"></h1>
            <p class="mb-0 fs-5">Hãy đọc kĩ đề và làm bài thật tốt nhé!</p>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">Phần 1: Trắc nghiệm (Chọn đáp án đúng nhất)</div>
            <div class="card-body" id="mcqContainer">
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header">Phần 2: Tự luận</div>
            <div class="card-body" id="essayContainer">
            </div>
        </div>

        <div class="text-center mt-4 mb-5">
            <button class="btn-submit shadow-lg" onclick="submitExam()">NỘP BÀI</button>
        </div>
    </div>

    <div id="resultView" class="container mt-5 mb-5 hidden">
        <div class="card shadow-lg" style="border-radius: 20px; overflow: hidden;">
            <div class="card-header text-center text-white" style="font-size: 2rem; background: #007bff;">KẾT QUẢ BÀI LÀM</div>
            <div class="card-body p-4 p-md-5" style="background-color: white; color: #333;">
                <h3 class="text-center mb-4">Điểm Trắc Nghiệm: <span id="mcqScore" class="text-danger fw-bold fs-1"></span> / 5</h3>
                <hr>
                <h4 class="mb-4 text-center text-primary">BÀI LÀM TỰ LUẬN (Dành cho giáo viên chấm)</h4>
                <div id="essayResults"></div>
                
                <div class="text-center mt-5">
                    <button class="btn btn-secondary btn-lg rounded-pill px-5 fw-bold" onclick="location.reload()">Quay Về Trang Chủ</button>
                </div>
            </div>
        </div>
    </div>

<script>
    // Hàm tạo phân số đứng
    function f(n, d) {
        return `<div class="fraction"><span class="numerator">${n}</span><span class="denominator">${d}</span></div>`;
    }

    // BỘ CÂU HỎI TRẮC NGHIỆM LỚP 4
    const mcqData4 = [
        { q: `1/2 + 1/3 = ? <br> ${f(1,2)} + ${f(1,3)} = ?`, opts: [f(2,5), f(5,6), f(3,6), f(1,6)], ans: 1 },
        { q: `4/5 - 1/2 = ? <br> ${f(4,5)} - ${f(1,2)} = ?`, opts: [f(3,3), f(5,10), f(3,10), f(4,10)], ans: 2 },
        { q: `2/7 × 3/4 = ? <br> ${f(2,7)} × ${f(3,4)} = ?`, opts: [f(6,28), f(5,11), f(6,11), f(5,28)], ans: 0 },
        { q: `3/4 ÷ 1/2 = ? <br> ${f(3,4)} ÷ ${f(1,2)} = ?`, opts: [f(3,8), f(6,4), f(4,6), f(1,2)], ans: 1 },
        { q: `2/4 + 1/2 = ? <br> ${f(2,4)} + ${f(1,2)} = ?`, opts: [f(1,1), f(2,2), f(4,4), 'Tất cả đều đúng'], ans: 3 }
    ];

    // BỘ CÂU HỎI TRẮC NGHIỆM LỚP 5
    const mcqData5 = [
        { q: `7,42 + 15,9 = ?`, opts: ['22,51', '23,32', '13,32', '22,42'], ans: 1 },
        { q: `25 - 8,34 = ?`, opts: ['17,66', '16,66', '16,76', '17,76'], ans: 1 },
        { q: `1/3 + 5/12 = ? <br> ${f(1,3)} + ${f(5,12)} = ?`, opts: [f(6,15), f(9,12), f(3,4), f(6,12)], ans: 1 },
        { q: `3/5 × 2/7 = ? <br> ${f(3,5)} × ${f(2,7)} = ?`, opts: [f(5,12), f(6,35), f(5,35), f(6,12)], ans: 1 },
        { q: `1,2 + 4/5 = ? <br> 1,2 + ${f(4,5)} = ?`, opts: ['1,6', '2,0', '1,8', '2,2'], ans: 1 }
    ];

    let currentExamGrade = 0;
    let currentData = [];

    function renderMCQ(grade) {
        let html = '';
        const labels = ['A', 'B', 'C', 'D'];
        
        if (grade === 4) {
            currentData = mcqData4;
        } else {
            currentData = mcqData5;
        }
        
        for (let i = 0; i < currentData.length; i++) {
            const item = currentData[i];
            html += `<div class="mb-4">
                        <p class="question-title">Câu ${i + 1}: ${item.q}</p>`;
            for (let j = 0; j < item.opts.length; j++) {
                html += `
                    <div class="form-check form-check-inline me-4">
                        <input class="form-check-input" type="radio" name="q${i}" id="q${i}_${j}" value="${j}">
                        <label class="form-check-label" for="q${i}_${j}">
                            ${labels[j]}. ${item.opts[j]}
                        </label>
                    </div>`;
            }
            html += `</div>`;
            if (i < currentData.length - 1) {
                html += `<hr style="opacity: 0.15;">`;
            }
        }
        document.getElementById('mcqContainer').innerHTML = html;
    }

    function renderEssay(grade) {
        let html = '';
        
        if (grade === 4) {
            const q1= `Nhóm bạn của Tâm cùng nhau bán đồ thủ công và thu được 4 800 000 đồng. Các bạn trích ra 1 800 000 đồng để đóng góp vào quỹ bảo vệ môi trường của phường. Sau đó, các bạn dùng 3/4 số tiền còn lại để mua nguyên liệu làm thêm các sản phẩm mới. Số tiền cuối cùng còn lại được dùng để khao cả nhóm một bữa kem. Hỏi số tiền các bạn đã dành để mua kem là bao nhiêu?`;
            const q2 = `Gia đình bạn An tiết kiệm được 7 500 000 đồng từ việc nuôi lợn đất. Cả nhà quyết định trích ra 2 700 000 đồng để mua một chiếc xe đạp mới cho An. Sau đó, bố mẹ dùng 3/8 số tiền còn lại để mua sách vở và đồ dùng học tập cho năm học mới. Số tiền cuối cùng còn lại được gửi tiết kiệm vào ngân hàng. Hỏi gia đình An đã gửi vào ngân hàng bao nhiêu tiền?`;
            
            const qs = [q1, q2];

            for (let b = 0; b < qs.length; b++) {
                html += `<div class="mb-5">
                            <p class="question-title">Bài ${b + 1}:</p>
                            <p class="mb-4" style="line-height: 1.6;">${qs[b]}</p>`;
                for (let i = 1; i <= 3; i++) {
                    html += `<div class="essay-step">
                                <input type="text" class="form-control" id="essay_b${b}_step${i}_txt" placeholder="Bước ${i}: Lời giải...">
                                <input type="text" class="form-control mb-0" id="essay_b${b}_step${i}_calc" placeholder="Phép tính (kèm đơn vị)...">
                             </div>`;
                }
                html += `<input type="text" class="form-control fw-bold fs-5 mt-3 py-2" id="essay_b${b}_final" placeholder="Đáp số: ...">
                         </div>`;
            }
        } else if (grade === 5) {
            // Đã thêm backtick đóng chuỗi và bổ sung dữ kiện vận tốc
            const q1 = `Quãng đường từ tỉnh A đến tỉnh B dài 240 km. Một ô tô xuất phát từ A lúc 6 giờ 15 phút với vận tốc 50 km/giờ.<br>
                        a) Hỏi lúc 8 giờ 15 phút ô tô còn cách B bao nhiêu ki-lô-mét?<br>
                        b) Để đi hết quãng đường còn lại trong 2,5 giờ thì ô tô phải di chuyển với vận tốc bao nhiêu ki-lô-mét trên giờ?`;
            const q2 = `Quãng đường từ nhà lên huyện dài 45 km. Một người đi xe đạp xuất phát từ nhà lúc 8 giờ sáng với vận tốc 12 km/giờ.<br>
                        a) Hỏi lúc 10 giờ người đó còn cách huyện bao nhiêu ki-lô-mét?<br>
                        b) Để đi hết quãng đường còn lại trong 1,5 giờ thì người đó phải đạp xe với vận tốc bao nhiêu ki-lô-mét trên giờ?`;
            const qs = [q1, q2];

            for (let b = 0; b < qs.length; b++) {
                html += `<div class="mb-5">
                            <p class="question-title">Bài ${b + 1}:</p>
                            <p class="mb-4" style="line-height: 1.6;">${qs[b]}</p>`;
                for (let i = 1; i <= 4; i++) {
                    html += `<div class="essay-step">
                                <input type="text" class="form-control" id="essay_b${b}_step${i}_txt" placeholder="Bước ${i}: Lời giải...">
                                <input type="text" class="form-control mb-0" id="essay_b${b}_step${i}_calc" placeholder="Phép tính (kèm đơn vị)...">
                             </div>`;
                }
                html += `<div class="d-flex gap-3 mt-3">
                            <input type="text" class="form-control fw-bold fs-5 py-2" id="essay_b${b}_finalA" placeholder="Đáp số a: ...">
                            <input type="text" class="form-control fw-bold fs-5 py-2" id="essay_b${b}_finalB" placeholder="Đáp số b: ...">
                         </div>
                         </div>`;
            }
        }

        document.getElementById('essayContainer').innerHTML = html;
    }

    function startExam(grade) {
        currentExamGrade = grade;
        
        document.getElementById('landingView').classList.add('hidden');
        document.getElementById('examView').classList.remove('hidden');

        const body = document.getElementById('mainBody');
        body.className = ''; 
        
        if (grade === 4) {
            body.classList.add('theme-green-g4');
            document.getElementById('examTitle').innerText = "ĐỀ THI HỌC KÌ 2 - LỚP 4";
        } else if (grade === 5) {
            body.classList.add('theme-purple-g5');
            document.getElementById('examTitle').innerText = "ĐỀ THI HỌC KÌ 2 - LỚP 5";
        }

        renderMCQ(grade);
        renderEssay(grade);
    }

    function submitExam() {
        let score = 0;
        for (let i = 0; i < currentData.length; i++) {
            const selectedOptions = document.getElementsByName(`q${i}`);
            for (let j = 0; j < selectedOptions.length; j++) {
                if (selectedOptions[j].checked) {
                    const parsedValue = parseInt(selectedOptions[j].value);
                    if (parsedValue === currentData[i].ans) {
                        score = score + 1;
                    }
                }
            }
        }

        let essayHtml = '';
        let numSteps = 3;
        if (currentExamGrade === 5) {
            numSteps = 4;
        }

        for (let b = 0; b < 2; b++) {
            essayHtml += `<div class="mb-4 p-4 border rounded shadow-sm" style="background-color: #f8f9fa;">
                            <h5 class="fw-bold text-primary mb-3">Bài ${b + 1}</h5>`;
            
            for (let i = 1; i <= numSteps; i++) {
                const txt = document.getElementById(`essay_b${b}_step${i}_txt`).value;
                const calc = document.getElementById(`essay_b${b}_step${i}_calc`).value;
                essayHtml += `
                    <div class="mb-2">
                        <strong>Bước ${i}:</strong><br>
                        - Lời giải: <em>${txt}</em><br>
                        - Phép tính: <strong>${calc}</strong>
                    </div>`;
            }

            if (currentExamGrade === 4) {
                const finalVal = document.getElementById(`essay_b${b}_final`).value;
                essayHtml += `<div class="mt-3 text-danger fw-bold fs-5 p-2 bg-white border rounded d-inline-block">Đáp số: ${finalVal}</div>`;
            } else if (currentExamGrade === 5) {
                const finalA = document.getElementById(`essay_b${b}_finalA`).value;
                const finalB = document.getElementById(`essay_b${b}_finalB`).value;
                essayHtml += `<div class="mt-3 text-danger fw-bold fs-5 p-2 bg-white border rounded">
                                Đáp số a: ${finalA} <br> Đáp số b: ${finalB}
                              </div>`;
            }
            essayHtml += `</div>`;
        }

        document.getElementById('examView').classList.add('hidden');
        document.getElementById('resultView').classList.remove('hidden');
        document.getElementById('mainBody').className = 'theme-landing';

        document.getElementById('mcqScore').innerText = score;
        document.getElementById('essayResults').innerHTML = essayHtml;
        window.scrollTo(0,0);
    }
</script>
</body>
</html>
