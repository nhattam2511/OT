<script id="math-row-equal-format-patch-script">
(function(){
  function isMathEssay(essay){
    const type = String((essay && essay.type) || '').toLowerCase();
    const prompt = String((essay && essay.prompt) || '').toLowerCase();
    return type === 'expression' || type === 'convenient' || prompt.includes('tính giá trị biểu thức') || prompt.includes('tính bằng cách thuận tiện');
  }
  function isConvenientEssay(essay){
    const type = String((essay && essay.type) || '').toLowerCase();
    const prompt = String((essay && essay.prompt) || '').toLowerCase();
    return type === 'convenient' || prompt.includes('tính bằng cách thuận tiện');
  }
  function mathEssayTitle(essay, idx){
    if (isConvenientEssay(essay)) return `Bài ${idx + 1}. Tính bằng cách thuận tiện nhất`;
    if (isMathEssay(essay)) return `Bài ${idx + 1}. Tính giá trị biểu thức`;
    return `Bài ${idx + 1}. Bài giải có lời văn`;
  }
  function stripMathPrompt(prompt, essay){
    let s = String(prompt || '').trim();
    if (isMathEssay(essay)) {
      s = s.replace(/^\s*Tính\s+giá\s+trị\s+(của\s+)?biểu\s+thức\s*[:：]?\s*/i, '');
      s = s.replace(/^\s*Tính\s+bằng\s+cách\s+thuận\s+tiện(\s+nhất)?\s*[:：]?\s*/i, '');
      s = s.replace(/^\s*Tính\s*[:：]\s*/i, '');
    }
    return s;
  }
  function sanitizeMathHTMLSafe(html){
    if (typeof sanitizeMathHTML === 'function') return sanitizeMathHTML(html);
    const div = document.createElement('div');
    div.innerHTML = String(html || '');
    div.querySelectorAll('*').forEach(el => {
      if (el.tagName.toLowerCase() !== 'span' && el.tagName.toLowerCase() !== 'br') el.replaceWith(document.createTextNode(el.textContent || ''));
      else if (el.tagName.toLowerCase() === 'span') {
        const classes = String(el.getAttribute('class') || '').split(/\s+/).filter(c => ['frac','input-frac','num','den'].includes(c));
        el.setAttribute('class', classes.join(' '));
        Array.from(el.attributes).forEach(a => { if (!['class','contenteditable','data-kind'].includes(a.name)) el.removeAttribute(a.name); });
      }
    });
    return div.innerHTML;
  }
  function getEditorHTML(editor){ return editor ? sanitizeMathHTMLSafe(editor.innerHTML || '').trim() : ''; }
  function setEditorHTML(editor, value){
    if (!editor) return;
    const raw = String(value || '');
    if (/<span[^>]*class=["'][^"']*(frac|input-frac)/i.test(raw)) editor.innerHTML = sanitizeMathHTMLSafe(raw);
    else editor.textContent = raw;
  }
  function escapeText(value){
    if (typeof escapeHTMLText === 'function') return escapeHTMLText(value);
    return String(value || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }
  function renderSavedMathSafe(value){
    const raw = String(value || '').trim();
    if (!raw) return '<span class="empty-work">Chưa nhập</span>';
    if (/<span[^>]*class=["'][^"']*(frac|input-frac)/i.test(raw)) return sanitizeMathHTMLSafe(raw);
    return escapeText(raw);
  }
  function insertHTMLCaret(html){
    if (typeof insertHTMLAtCaret === 'function') return insertHTMLAtCaret(html);
    const sel = window.getSelection && window.getSelection();
    if (!sel || !sel.rangeCount) return false;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const temp = document.createElement('div');
    temp.innerHTML = html;
    const frag = document.createDocumentFragment();
    let node, last = null;
    while ((node = temp.firstChild)) last = frag.appendChild(node);
    range.insertNode(frag);
    if (last) {
      range.setStartAfter(last);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    return true;
  }
  function selectedEditorInside(paper){
    const editor = (window.activeMathEditor && paper && paper.contains(window.activeMathEditor)) ? window.activeMathEditor : null;
    return editor || (paper ? paper.querySelector('.math-line-editor, .math-work-editor') : document.querySelector('.math-line-editor, .math-work-editor'));
  }

  window.mathLineHTML = function(essayIdx, lineNo, content){
    const uid = `math_${essayIdx}_${lineNo}_${Date.now()}_${Math.floor(Math.random()*1000)}`;
    return `<div class="math-calc-row" data-line="${lineNo}">
      <span class="math-equal">=</span>
      <div id="${uid}" class="math-line-editor" contenteditable="true" spellcheck="false" data-placeholder="Nhập phép tính..."></div>
      <button type="button" class="math-delete-row" title="Xóa hàng tính" onclick="removeMathLine(this)">×</button>
    </div>`;
  };
  window.addMathLine = function(essayIdx, content){
    const box = document.getElementById(`mathLines${essayIdx}`);
    if (!box) return;
    const next = box.querySelectorAll('.math-calc-row').length + 1;
    box.insertAdjacentHTML('beforeend', window.mathLineHTML(essayIdx, next));
    const row = box.lastElementChild;
    const editor = row ? row.querySelector('.math-line-editor') : null;
    if (editor) {
      setEditorHTML(editor, content || '');
      focusMathEditorPatch(editor);
    }
    renumberMathLines(essayIdx);
    if (typeof scheduleSave === 'function') scheduleSave();
  };
  window.removeMathLine = function(btn){
    const row = btn && btn.closest ? btn.closest('.math-calc-row') : null;
    if (!row) return;
    const box = row.closest('.math-line-list');
    row.remove();
    if (box && box.children.length === 0) {
      const idx = Number(box.id.replace('mathLines',''));
      window.addMathLine(idx, '');
    }
    if (box) renumberMathLines(Number(box.id.replace('mathLines','')));
    if (typeof scheduleSave === 'function') scheduleSave();
  };
  function renumberMathLines(essayIdx){
    const box = document.getElementById(`mathLines${essayIdx}`);
    if (!box) return;
    box.querySelectorAll('.math-calc-row').forEach((row, i) => row.dataset.line = String(i + 1));
  }
  function focusMathEditorPatch(editor){
    if (!editor) return;
    window.activeMathEditor = editor;
    try { activeMathEditor = editor; } catch(err) {}
    editor.focus();
  }
  window.insertMathSymbol = function(essayIdx, symbol){
    const paper = document.getElementById(`mathLines${essayIdx}`)?.closest('.math-work-paper');
    const editor = selectedEditorInside(paper);
    if (!editor) return;
    focusMathEditorPatch(editor);
    document.execCommand('insertText', false, String(symbol) + ' ');
    if (typeof scheduleSave === 'function') scheduleSave();
  };
  window.insertMathFraction = function(essayIdx){
    const paper = document.getElementById(`mathLines${essayIdx}`)?.closest('.math-work-paper');
    const editor = selectedEditorInside(paper);
    if (!editor) return;
    focusMathEditorPatch(editor);
    const numerator = prompt('Nhập tử số của phân số:');
    if (numerator === null) return;
    const denominator = prompt('Nhập mẫu số của phân số:');
    if (denominator === null) return;
    const n = String(numerator).trim();
    const d = String(denominator).trim();
    if (!n || !d) { alert('Tử số và mẫu số không được để trống.'); return; }
    insertHTMLCaret(`<span class="input-frac frac" contenteditable="false" data-kind="fraction"><span class="num">${escapeText(n)}</span><span class="den">${escapeText(d)}</span></span>&nbsp;`);
    if (typeof scheduleSave === 'function') scheduleSave();
  };

  function renderMathEssay(essay, idx){
    const cleanPrompt = stripMathPrompt(essay.prompt, essay);
    return `<div class="essay-mini-card math-work-card" data-essay-type="${escapeText(essay.type || '')}">
      <p class="essay-mini-title">${mathEssayTitle(essay, idx)}</p>
      <div class="essay-prompt">${cleanPrompt}</div>
      <div class="math-work-paper">
        <div class="math-work-toolbar">
          <button type="button" class="math-tool-btn" onclick="addMathLine(${idx}, '')">+ Thêm hàng tính</button>
          <button type="button" class="math-tool-btn frac-tool" onclick="insertMathFraction(${idx})">Chèn phân số</button>
          ${['+','−','×',':','=','(',')'].map(s => `<button type="button" class="math-symbol-btn" onclick="insertMathSymbol(${idx}, '${s}')">${s}</button>`).join('')}
        </div>
        <div class="math-line-list" id="mathLines${idx}">${window.mathLineHTML(idx, 1)}</div>
      </div>
    </div>`;
  }
  function renderWordEssay(essay, idx){
    return `<div class="essay-mini-card" data-essay-type="word">
      <p class="essay-mini-title">${mathEssayTitle(essay, idx)}</p>
      <div class="essay-prompt">${essay.prompt || ''}</div>
      <div class="solution-paper">
        <div class="solution-title">BÀI GIẢI</div>
        <div class="solution-toolbar">
          <button type="button" class="solution-action-btn" onclick="addEssayStepBlock(${idx})">+ Thêm lời giải</button>
          <button type="button" class="solution-action-btn fraction" onclick="insertFractionIntoEssay(${idx})">+ Chèn phân số</button>
          <button type="button" class="solution-action-btn answer" onclick="addEssayAnswerBlock(${idx})">+ Thêm đáp số</button>
        </div>
        <div class="solution-steps" id="essaySteps${idx}">${typeof essayStepHTML === 'function' ? essayStepHTML(idx, 1) : ''}</div>
        <div class="empty-solution-hint">Bấm “Thêm lời giải” để thêm dòng làm bài.</div>
        <div class="answer-list" id="essayAnswers${idx}">${typeof essayAnswerHTML === 'function' ? essayAnswerHTML(idx, 1) : ''}</div>
      </div>
    </div>`;
  }

  window.renderExam = function(){
    const root = document.getElementById('examRoot');
    if (!root) return;
    const qsHtml = (currentQuestions || []).map((q, i) => `
      <div class="mcq-block" data-index="${i}">
        <p class="question-title">Câu ${i + 1}: ${q.text || ''}</p>
        <div class="option-grid">
          ${(q.choices || []).map((c, j) => `
            <label class="option" data-q="${i}" data-opt="${j}">
              <input type="radio" name="q${i}" value="${j}" ${j === q.answer ? 'data-correct="true"' : ''} />
              <span><span class="letter">${LETTERS[j]}.</span> ${c}</span>
            </label>`).join('')}
        </div>
      </div>`).join('');
    root.innerHTML = `<div class="card"><div class="card-header">Phần 1: Trắc nghiệm</div><div class="card-body">${qsHtml}</div></div>
      <div class="card"><div class="card-header">Phần 2: Bài giải tự luận</div><div class="card-body"><div class="essay-card-grid">
      ${(currentEssays || []).map((essay, idx) => isMathEssay(essay) ? renderMathEssay(essay, idx) : renderWordEssay(essay, idx)).join('')}
      </div></div></div>`;
  };

  window.collectCurrentWork = function(){
    const answers = (currentQuestions || []).map((q, i) => {
      const checked = document.querySelector(`input[name="q${i}"]:checked`);
      return checked ? Number(checked.value) : null;
    });
    const essays = (currentEssays || []).map((essay, idx) => {
      if (isMathEssay(essay)) {
        const rows = Array.from(document.querySelectorAll(`#mathLines${idx} .math-line-editor`)).map(getEditorHTML);
        return { type: essay.type || '', mathRows: rows.length ? rows : [''] };
      }
      const steps = Array.from(document.querySelectorAll(`#essaySteps${idx} .solution-step`)).map(step => {
        const reasonInput = step.querySelector('.solution-field input');
        const calcEditor = step.querySelector('.math-work-editor');
        return { reason: reasonInput ? reasonInput.value : '', calc: getEditorHTML(calcEditor) };
      });
      const essayAnswers = Array.from(document.querySelectorAll(`#essayAnswers${idx} .answer-step .math-work-editor`)).map(getEditorHTML);
      return { type: essay.type || 'word', steps, answers: essayAnswers };
    });
    return { grade: currentGrade, test: currentTest, savedAt: new Date().toISOString(), answers, essays };
  };

  window.ensureEssayRows = function(idx, data){
    const essay = (currentEssays || [])[idx] || {};
    if (isMathEssay(essay)) {
      const box = document.getElementById(`mathLines${idx}`);
      if (!box) return;
      let rows = [];
      if (data && Array.isArray(data.mathRows)) rows = data.mathRows;
      else if (data && Array.isArray(data.steps)) rows = data.steps.map(s => s.calc || '').filter((_, i) => i >= 0);
      if (!rows.length) rows = [''];
      box.innerHTML = rows.map((_, i) => window.mathLineHTML(idx, i + 1)).join('');
      box.querySelectorAll('.math-line-editor').forEach((editor, i) => setEditorHTML(editor, rows[i] || ''));
      renumberMathLines(idx);
      return;
    }
    const stepsBox = document.getElementById(`essaySteps${idx}`);
    const answersBox = document.getElementById(`essayAnswers${idx}`);
    const steps = data && Array.isArray(data.steps) && data.steps.length ? data.steps : [{reason:'', calc:''}];
    const answers = data && Array.isArray(data.answers) && data.answers.length ? data.answers : [''];
    if (stepsBox && typeof essayStepHTML === 'function') {
      stepsBox.innerHTML = steps.map((s, i) => essayStepHTML(idx, i + 1)).join('');
      stepsBox.querySelectorAll('.solution-step').forEach((step, i) => {
        const reasonInput = step.querySelector('.solution-field input');
        const calcEditor = step.querySelector('.math-work-editor');
        if (reasonInput) reasonInput.value = steps[i].reason || '';
        setEditorHTML(calcEditor, steps[i].calc || '');
      });
    }
    if (answersBox && typeof essayAnswerHTML === 'function') {
      answersBox.innerHTML = answers.map((a, i) => essayAnswerHTML(idx, i + 1)).join('');
      answersBox.querySelectorAll('.answer-step .math-work-editor').forEach((editor, i) => setEditorHTML(editor, answers[i] || ''));
    }
    if (typeof renumberEssayBlocks === 'function') renumberEssayBlocks(idx);
  };

  window.resetEssayToBlank = function(){
    (currentEssays || []).forEach((essay, idx) => {
      if (isMathEssay(essay)) window.ensureEssayRows(idx, {mathRows:['']});
      else window.ensureEssayRows(idx, {steps:[{reason:'', calc:''}], answers:['']});
    });
  };

  window.renderTeacherEssayView = function(work){
    const panel = document.getElementById('teacherEssayView');
    if (!panel) return;
    const data = work || (typeof collectCurrentWork === 'function' ? collectCurrentWork() : {essays:[]});
    const html = (currentEssays || []).map((essay, idx) => {
      const saved = data.essays && data.essays[idx] ? data.essays[idx] : {};
      if (isMathEssay(essay)) {
        const rows = (saved.mathRows || []).filter(r => String(r || '').trim());
        const rowsHtml = rows.length ? rows.map((r, i) => `<div class="teacher-line"><b>Dòng ${i + 1}:</b> = ${renderSavedMathSafe(r)}</div>`).join('') : '<div class="teacher-line empty-work">Học sinh chưa nhập hàng tính.</div>';
        return `<div class="teacher-essay-card"><h4>${mathEssayTitle(essay, idx)}</h4><div class="teacher-line"><b>Đề bài:</b> ${stripMathPrompt(essay.prompt, essay)}</div>${rowsHtml}</div>`;
      }
      const steps = (saved.steps || []).filter(s => (s.reason || s.calc || '').trim());
      const answers = (saved.answers || []).filter(a => String(a || '').trim());
      const stepsHtml = steps.length ? steps.map((s, i) => `<div class="teacher-line"><b>Lời giải ${i + 1}:</b> ${escapeText(s.reason) || '<span class="empty-work">Chưa nhập</span>'}<br><b>Phép tính:</b> ${renderSavedMathSafe(s.calc)}</div>`).join('') : '<div class="teacher-line empty-work">Học sinh chưa nhập lời giải.</div>';
      const ansHtml = answers.length ? answers.map((a, i) => `<div class="teacher-line"><b>Đáp số ${i + 1}:</b> ${renderSavedMathSafe(a)}</div>`).join('') : '<div class="teacher-line empty-work">Học sinh chưa nhập đáp số.</div>';
      return `<div class="teacher-essay-card"><h4>${mathEssayTitle(essay, idx)}</h4><div class="teacher-line"><b>Đề bài:</b> ${essay.prompt || ''}</div>${stepsHtml}${ansHtml}</div>`;
    }).join('');
    panel.innerHTML = `<h3>Bài tự luận học sinh đã làm - giáo viên chấm trực tiếp</h3><div class="teacher-essay-grid">${html}</div>`;
    panel.classList.remove('hidden');
  };

  document.addEventListener('focusin', function(e){
    if (e.target && e.target.classList && (e.target.classList.contains('math-line-editor') || e.target.classList.contains('math-work-editor'))) {
      focusMathEditorPatch(e.target);
    }
  }, true);
  document.addEventListener('click', function(e){
    const editor = e.target && e.target.closest ? e.target.closest('.math-line-editor, .math-work-editor') : null;
    if (editor) focusMathEditorPatch(editor);
  }, true);
  document.addEventListener('keydown', function(e){
    const editor = e.target && e.target.classList && e.target.classList.contains('math-line-editor') ? e.target : null;

    if (e.key === 'Enter') {

      const box = editor.closest('.math-line-list');
      if (!box) return;
      const essayIdx = Number(box.id.replace('mathLines',''));
      window.addMathLine(essayIdx, '');
      const last = box.lastElementChild;
      const nextEditor = last ? last.querySelector('.math-line-editor') : null;
      if (nextEditor) focusMathEditorPatch(nextEditor);
    }
  }, true);
})();

<script id="password-flex-fraction-upgrade-script">
(function(){
  if (window.__passwordFlexFractionUpgradeInstalled) return;
  window.__passwordFlexFractionUpgradeInstalled = true;

  const EXAM_PASSWORDS = {
    4: ['VDD1','VDDC','VDDN','VDDOT','VDD3','VDD9'],
    5: ['VBN1','VBNC','VBNN','VBNOT','VBN3','VBN9']
  };
  const passwordAttempts = Object.create(null);
  const unlockedExams = Object.create(null);

  function escapeHTMLSafe(value){
    if (typeof escapeHTMLText === 'function') return escapeHTMLText(value);
    return String(value || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
  }
  function showPasswordToast(message){
    let toast = document.getElementById('passwordNoteToast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'passwordNoteToast';
      toast.className = 'password-note-toast';
      document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showPasswordToast.timer);
    showPasswordToast.timer = setTimeout(() => toast.classList.remove('show'), 1500);
  }
  function currentGradeSafe(){
    try { if (typeof currentGrade !== 'undefined') return Number(currentGrade); } catch(err) {}
    return Number(window.currentGrade || 0);
  }
  function scareForWrongPassword(){
    if (typeof window.triggerRandomScare === 'function') return window.triggerRandomScare('wrong');
    if (typeof window.triggerJumpscare === 'function') return window.triggerJumpscare('NHẬP SAI 3 LẦN RỒI! TẬP TRUNG LẠI NHA!', '👻');
    alert('Sai mật khẩu 3 lần!');
  }
  function checkExamPassword(test){
    const grade = currentGradeSafe();
    const correct = EXAM_PASSWORDS[grade] && EXAM_PASSWORDS[grade][Number(test) - 1];
    if (!correct) return true;
    const key = grade + '-' + test;
    if (unlockedExams[key]) return true;
    const entered = prompt('Nhập mật khẩu Đề ' + test + ' - Toán Lớp ' + grade + ':');
    if (entered === null) return false;
    if (String(entered).trim().toUpperCase() === correct.toUpperCase()) {
      unlockedExams[key] = true;
      passwordAttempts[key] = 0;
      showPasswordToast('✅ Đúng mật khẩu. Bắt đầu làm bài!');
      return true;
    }
    passwordAttempts[key] = (passwordAttempts[key] || 0) + 1;
    const remaining = 3 - passwordAttempts[key];
    if (passwordAttempts[key] >= 3) {
      passwordAttempts[key] = 0;
      scareForWrongPassword();
      showPasswordToast('👻 Sai mật khẩu 3 lần!');
    } else {
      alert('Sai mật khẩu.');
    }
    return false;
  }

  if (typeof window.startExam === 'function' && !window.__startExamPasswordWrapped) {
    const originalStartExam = window.startExam;
    window.startExam = function(test){
      if (!checkExamPassword(test)) return;
      return originalStartExam.apply(this, arguments);
    };
    window.__startExamPasswordWrapped = true;
  }

  function editorContainsSelection(editor){
    const sel = window.getSelection && window.getSelection();
    if (!sel || !sel.rangeCount || !editor) return false;
    const node = sel.anchorNode;
    return !!(node && (node === editor || editor.contains(node)));
  }
  function placeCaretAtEnd(editor){
    if (!editor) return;
    const sel = window.getSelection && window.getSelection();
    if (!sel) return;
    const range = document.createRange();
    range.selectNodeContents(editor);
    range.collapse(false);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  function getActiveMathEditorFromContainer(container){
    let editor = null;
    try { if (window.activeMathEditor && document.body.contains(window.activeMathEditor)) editor = window.activeMathEditor; } catch(err) {}
    try { if (!editor && typeof activeMathEditor !== 'undefined' && activeMathEditor && document.body.contains(activeMathEditor)) editor = activeMathEditor; } catch(err) {}
    if (editor && container && !container.contains(editor)) editor = null;
    if (!editor) editor = container ? container.querySelector('.math-line-editor, .math-work-editor') : document.querySelector('.math-line-editor, .math-work-editor');
    return editor;
  }
  function focusEditableMath(editor){
    if (!editor) return;
    editor.setAttribute('contenteditable', 'true');
    try { window.activeMathEditor = editor; } catch(err) {}
    try { activeMathEditor = editor; } catch(err) {}
    editor.focus();
    if (!editorContainsSelection(editor)) placeCaretAtEnd(editor);
  }
  function readFractionPartsFromUser(defaultText){
    let firstDefault = String(defaultText || '').trim();
    let numerator = '';
    let denominator = '';
    const slashMatch = firstDefault.match(/^(.+?)\s*\/\s*(.+)$/);
    if (slashMatch) {
      numerator = slashMatch[1].trim();
      denominator = slashMatch[2].trim();
    }
    const first = prompt('Nhập phân số dạng a/b hoặc nhập tử số:', numerator && denominator ? (numerator + '/' + denominator) : firstDefault);
    if (first === null) return null;
    const cleaned = String(first).trim();
    const match = cleaned.match(/^(.+?)\s*\/\s*(.+)$/);
    if (match) {
      numerator = match[1].trim();
      denominator = match[2].trim();
    } else {
      numerator = cleaned;
      const den = prompt('Nhập mẫu số:', denominator || '');
      if (den === null) return null;
      denominator = String(den).trim();
    }
    if (!numerator || !denominator) {
      alert('Tử số và mẫu số không được để trống.');
      return null;
    }
    return { numerator, denominator };
  }
  function insertHTMLAtCurrentCaret(html){
    if (typeof insertHTMLAtCaret === 'function') return insertHTMLAtCaret(html);
    const sel = window.getSelection && window.getSelection();
    if (!sel || !sel.rangeCount) return false;
    const range = sel.getRangeAt(0);
    range.deleteContents();
    const temp = document.createElement('div');
    temp.innerHTML = html;
    const frag = document.createDocumentFragment();
    let node, lastNode = null;
    while ((node = temp.firstChild)) lastNode = frag.appendChild(node);
    range.insertNode(frag);
    if (lastNode) {
      range.setStartAfter(lastNode);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }
    return true;
  }
  function insertFlexibleFractionInto(editor){
    if (!editor) return;
    focusEditableMath(editor);
    const sel = window.getSelection && window.getSelection();
    const selectedText = (sel && sel.rangeCount && editorContainsSelection(editor)) ? String(sel.toString() || '').trim() : '';
    const parts = readFractionPartsFromUser(selectedText);
    if (!parts) return;
    focusEditableMath(editor);
    const html = '<span class="input-frac frac" contenteditable="false" data-kind="fraction" title="Nhấp đúp để sửa phân số"><span class="num">' + escapeHTMLSafe(parts.numerator) + '</span><span class="den">' + escapeHTMLSafe(parts.denominator) + '</span></span>&nbsp;';
    insertHTMLAtCurrentCaret(html);
    if (typeof scheduleSave === 'function') scheduleSave();
  }

  window.insertMathFraction = function(essayIdx){
    const box = document.getElementById('mathLines' + essayIdx);
    const paper = box ? box.closest('.math-work-paper') : null;
    const editor = getActiveMathEditorFromContainer(paper || box || document);
    insertFlexibleFractionInto(editor);
  };
  window.insertFractionIntoEssay = function(essayIdx){
    const stepBox = document.getElementById('essaySteps' + essayIdx);
    const answerBox = document.getElementById('essayAnswers' + essayIdx);
    const paper = stepBox ? stepBox.closest('.solution-paper') : (answerBox ? answerBox.closest('.solution-paper') : null);
    const editor = getActiveMathEditorFromContainer(paper || document);
    insertFlexibleFractionInto(editor);
  };
  window.editInsertedFraction = function(fracEl){
    if (!fracEl) return;
    const oldN = fracEl.querySelector('.num') ? fracEl.querySelector('.num').textContent : '';
    const oldD = fracEl.querySelector('.den') ? fracEl.querySelector('.den').textContent : '';
    const first = prompt('Sửa phân số dạng a/b hoặc sửa tử số:', oldN + '/' + oldD);
    if (first === null) return;
    const value = String(first).trim();
    let n = '';
    let d = '';
    const match = value.match(/^(.+?)\s*\/\s*(.+)$/);
    if (match) {
      n = match[1].trim();
      d = match[2].trim();
    } else {
      n = value;
      const den = prompt('Sửa mẫu số:', oldD);
      if (den === null) return;
      d = String(den).trim();
    }
    if (!n || !d) {
      alert('Tử số và mẫu số không được để trống.');
      return;
    }
    const num = fracEl.querySelector('.num');
    const den = fracEl.querySelector('.den');
    if (num) num.textContent = n;
    if (den) den.textContent = d;
    fracEl.setAttribute('contenteditable', 'false');
    fracEl.setAttribute('title', 'Nhấp đúp để sửa phân số');
    if (typeof scheduleSave === 'function') scheduleSave();
  };

  document.addEventListener('focusin', function(e){
    const editor = e.target && e.target.closest ? e.target.closest('.math-line-editor, .math-work-editor') : null;
    if (editor) focusEditableMath(editor);
  }, true);
  document.addEventListener('click', function(e){
    const editor = e.target && e.target.closest ? e.target.closest('.math-line-editor, .math-work-editor') : null;
    if (editor) focusEditableMath(editor);
  }, true);
  document.addEventListener('dblclick', function(e){
    const fracEl = e.target && e.target.closest ? e.target.closest('.input-frac') : null;
    if (!fracEl) return;
    e.preventDefault();
    e.stopPropagation();
    window.editInsertedFraction(fracEl);
  }, true);
})();
</script>
</body>
</html>
