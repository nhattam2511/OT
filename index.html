<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hệ Thống Luyện Tập Môn Toán</title>
<style>
:root {
  --bg1:#071432;
  --bg2:#102a5c;
  --primary:#1d4ed8;
  --secondary:#0b1f4d;
  --accent:#7dd3fc;
  --text:#eaf6ff;
  --card:#ffffff;
  --border:#b7d9ff;
  --shadow:0 18px 48px rgba(4, 12, 34, .35);
}
* { box-sizing:border-box; }
*, *::before, *::after { max-width:100vw; }
body {
  margin:0;
  min-height:100vh;
  width:100%;
  max-width:100%;
  font-family: Arial, Helvetica, sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 12% 12%, rgba(125,211,252,.28), transparent 28%),
    radial-gradient(circle at 88% 18%, rgba(196,181,253,.20), transparent 30%),
    radial-gradient(circle at 50% 92%, rgba(34,197,94,.12), transparent 26%),
    linear-gradient(135deg, var(--bg1), var(--bg2));
  overflow-x:hidden;
}
html { width:100%; max-width:100%; overflow-x:hidden; }
img, svg, canvas, video { max-width:100%; height:auto; }
body.theme-g5 {
  --bg1:#fff0fb;
  --bg2:#eaf5ff;
  --primary:#8e44ad;
  --secondary:#5b2c83;
  --accent:#39d3b4;
  --border:#ecd8ff;
  --shadow:0 16px 40px rgba(142,68,173,.18);
}
.hidden { display:none !important; }
.container { width:min(1120px, calc(100% - 32px)); max-width:100%; margin:0 auto; padding:38px 0 60px; }
.header-banner {
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  color:white;
  border-radius:28px;
  padding:28px 30px;
  box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.32);
}
.header-banner h1, .header-banner h2 { margin:0; letter-spacing:.4px; }
.header-banner p { margin:10px 0 0; opacity:.95; }
.center { text-align:center; }
.landing-space { margin-top:9vh; }
.btn-row { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; align-items:center; margin-top:32px; }
.btn-custom, .btn-light, .btn-danger, .btn-success {
  border:0;
  cursor:pointer;
  border-radius:999px;
  padding:15px 30px;
  font-size:1.1rem;
  font-weight:800;
  letter-spacing:.2px;
  transition:.18s transform, .18s box-shadow, .18s background;
}
.btn-custom {
  color:white;
  background:linear-gradient(135deg, var(--primary), var(--secondary));
  box-shadow:0 10px 24px rgba(0,0,0,.16);
}
.btn-custom:hover, .btn-light:hover, .btn-danger:hover, .btn-success:hover { transform:translateY(-2px); box-shadow:0 14px 30px rgba(0,0,0,.2); }
.btn-light { background:white; color:var(--secondary); border:1px solid var(--border); }
.btn-danger { background:#e74c3c; color:white; }
.btn-success { background:#16a34a; color:white; }
.test-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:18px; margin-top:30px; }
.btn-test { width:100%; min-height:86px; font-size:1.4rem; }
.exam-top { display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap; align-items:center; }
.exam-actions { display:flex; gap:10px; flex-wrap:wrap; }
.card {
  margin-top:22px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  box-shadow:0 10px 28px rgba(0,0,0,.08);
  overflow:hidden;
}
.card-header {
  background:linear-gradient(135deg, rgba(17,159,134,.12), rgba(255,184,77,.16));
  border-bottom:1px solid var(--border);
  padding:16px 22px;
  font-size:1.2rem;
  font-weight:900;
  color:var(--secondary);
}
body.theme-g5 .card-header { background:linear-gradient(135deg, rgba(142,68,173,.13), rgba(57,211,180,.14)); }
.card-body { padding:22px; }
.notice {
  border:1px dashed var(--primary);
  background:rgba(255,255,255,.72);
  border-radius:18px;
  padding:14px 16px;
  margin-top:16px;
  line-height:1.6;
}
.mcq-block {
  padding:18px 0;
  border-bottom:1px solid #edf3f2;
}
.mcq-block:last-child { border-bottom:0; }
.question-title {
  margin:0 0 14px;
  font-size:1.08rem;
  font-weight:800;
  line-height:1.65;
}
.option-grid {
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
  gap:12px;
}
.option {
  display:flex;
  gap:10px;
  align-items:flex-start;
  line-height:1.55;
  background:#fbfffe;
  border:1px solid #e2efed;
  border-radius:16px;
  padding:12px 14px;
  cursor:pointer;
  min-height:54px;
}
.option:hover { border-color:var(--primary); box-shadow:0 6px 16px rgba(0,0,0,.08); }
.option input { margin-top:5px; transform:scale(1.12); accent-color:var(--primary); }
.option.correct { border-color:#16a34a; background:#ecfdf5; }
.option.wrong { border-color:#e74c3c; background:#fff1f0; }
.option .letter { font-weight:900; color:var(--secondary); }
.frac {
  display:inline-flex;
  vertical-align:middle;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-width:1.35em;
  margin:0 .08em;
  line-height:1.05;
  font-weight:800;
}
.frac .num {
  width:100%;
  text-align:center;
  padding:0 .16em .04em;
  border-bottom:2px solid currentColor;
}
.frac .den { width:100%; text-align:center; padding:.04em .16em 0; }
.math-inline { white-space:nowrap; font-weight:800; }
.essay-prompt {
  font-size:1.08rem;
  line-height:1.75;
  font-weight:700;
}
textarea {
  width:100%;
  min-height:140px;
  border:1px solid var(--border);
  border-radius:18px;
  padding:14px 16px;
  font-size:1rem;
  outline:none;
  resize:vertical;
  background:#fcfffe;
}
textarea:focus { border-color:var(--primary); box-shadow:0 0 0 4px rgba(17,159,134,.12); }
#scoreDisplay {
  margin-top:18px;
  padding:18px 20px;
  border-radius:20px;
  background:white;
  box-shadow:0 10px 24px rgba(0,0,0,.1);
  border:1px solid var(--border);
}
.answer-key {
  margin-top:18px;
  border-radius:20px;
  border:1px solid var(--border);
  background:#ffffff;
  padding:18px 20px;
  line-height:1.75;
}
.answer-key h3 { margin:0 0 10px; color:var(--secondary); }
.key-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:8px; }
.key-item { background:#f7fffd; border:1px solid #e4f4f1; border-radius:12px; padding:8px 10px; text-align:center; font-weight:800; }
.solution-box { margin-top:12px; background:#f8fffd; border-left:5px solid var(--primary); border-radius:14px; padding:14px 16px; }
.floating-nav-panel {
  position:fixed;
  left:18px;
  bottom:18px;
  z-index:100;
  display:flex;
  gap:8px;
  align-items:center;
  background:rgba(255,255,255,.92);
  border:1px solid var(--border);
  border-radius:999px;
  padding:8px 10px;
  box-shadow:0 10px 30px rgba(0,0,0,.13);
  backdrop-filter: blur(8px);
}
.nav-mini-btn {
  border:0;
  background:var(--primary);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:50%;
  cursor:pointer;
  font-weight:900;
}
.nav-mini-btn:disabled { opacity:.35; cursor:not-allowed; }
.nav-state-label { padding:0 10px 0 4px; font-size:.9rem; font-weight:800; color:var(--secondary); }

/* ===== BẢN ĐẸP HƠN - GIAO DIỆN VUI NHỘN GIỐNG MẪU CŨ ===== */
body::before {
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:-2;
  background:
    radial-gradient(circle at 18% 16%, rgba(255,255,255,.95), transparent 18%),
    radial-gradient(circle at 82% 14%, rgba(255,255,255,.65), transparent 20%),
    radial-gradient(circle at 65% 82%, rgba(255,184,77,.22), transparent 24%);
}
body::after {
  content:"";
  position:fixed;
  inset:-40px;
  pointer-events:none;
  z-index:-1;
  background-image:
    linear-gradient(115deg, transparent 0 46%, rgba(255,255,255,.35) 48%, transparent 51% 100%),
    radial-gradient(circle, rgba(255,255,255,.55) 0 2px, transparent 3px);
  background-size:420px 420px, 90px 90px;
  animation: bgDrift 24s linear infinite;
  opacity:.75;
}
@keyframes bgDrift { from { transform:translate3d(0,0,0); } to { transform:translate3d(90px,60px,0); } }
.scene-decor { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
.container, .floating-nav-panel { position:relative; z-index:2; }
.float-bubble { position:absolute; border-radius:50%; background:rgba(255,255,255,.35); border:1px solid rgba(255,255,255,.55); box-shadow:0 16px 40px rgba(15,118,110,.12); animation:bubbleFloat 12s ease-in-out infinite; }
.float-bubble.b1{ width:120px;height:120px;left:4%;top:10%; }
.float-bubble.b2{ width:80px;height:80px;right:8%;top:22%;animation-delay:2s; }
.float-bubble.b3{ width:150px;height:150px;right:12%;bottom:10%;animation-delay:4s; }
@keyframes bubbleFloat { 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-24px) scale(1.05);} }
.star-run { position:absolute; width:140px; height:2px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent); filter:drop-shadow(0 0 10px rgba(255,255,255,.9)); transform:rotate(-23deg); animation:starRun 7.5s linear infinite; opacity:.75; }
.star-run::after { content:"✦"; position:absolute; right:-8px; top:-11px; color:#fff7a8; font-size:18px; }
.star-run.s1{ top:10%; left:-12%; }
.star-run.s2{ top:34%; left:-25%; animation-delay:2.1s; }
.star-run.s3{ top:58%; left:-18%; animation-delay:4.4s; }
@keyframes starRun { 0% { transform:translateX(0) rotate(-23deg); opacity:0; } 12%{opacity:.8;} 100% { transform:translateX(125vw) rotate(-23deg); opacity:0; } }
.mascot { position:absolute; bottom:18px; font-size:42px; filter:drop-shadow(0 12px 14px rgba(0,0,0,.13)); animation:mascotMove 24s linear infinite; }
.mascot.m1{ left:-10vw; }
.mascot.m2{ left:-24vw; bottom:70px; animation-delay:7s; animation-duration:30s; }
@keyframes mascotMove { from{ transform:translateX(0) translateY(0); } 25%{ transform:translateX(32vw) translateY(-12px); } 50%{ transform:translateX(64vw) translateY(0); } 75%{ transform:translateX(92vw) translateY(-10px); } to{ transform:translateX(125vw) translateY(0); } }
.header-banner {
  position:relative;
  overflow:hidden;
  isolation:isolate;
}
.header-banner::before {
  content:"";
  position:absolute;
  inset:-80px -120px auto auto;
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  z-index:-1;
}
.header-banner::after {
  content:"";
  position:absolute;
  inset:auto auto -100px -70px;
  width:230px;
  height:230px;
  border-radius:50%;
  background:rgba(255,255,255,.12);
  z-index:-1;
}
.header-banner h1 { font-size:clamp(2rem, 4vw, 3.4rem); text-shadow:0 4px 18px rgba(0,0,0,.18); }
.header-banner h2 { font-size:clamp(1.6rem, 3vw, 2.4rem); text-shadow:0 4px 18px rgba(0,0,0,.14); }
.hero-chip-row { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:18px; }
.hero-chip { background:rgba(255,255,255,.92); color:var(--secondary); border:1px solid rgba(255,255,255,.65); border-radius:999px; padding:9px 14px; font-weight:900; box-shadow:0 8px 18px rgba(0,0,0,.08); }
.btn-custom, .btn-light, .btn-danger, .btn-success { position:relative; overflow:hidden; }
.btn-custom::before, .btn-light::before, .btn-danger::before, .btn-success::before {
  content:"";
  position:absolute;
  inset:0 auto 0 -60%;
  width:42%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
  transform:skewX(-18deg);
  transition:.45s left;
}
.btn-custom:hover::before, .btn-light:hover::before, .btn-danger:hover::before, .btn-success:hover::before { left:120%; }
.test-grid { grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); }
.btn-test { min-height:112px; border-radius:26px; font-size:1.45rem; box-shadow:0 16px 34px rgba(0,0,0,.14); }
.btn-test small { display:block; font-size:.85rem; opacity:.95; margin-top:6px; font-weight:700; }
.card { border-radius:28px; backdrop-filter:blur(8px); background:rgba(255,255,255,.94); }
.card-header { display:flex; align-items:center; gap:10px; font-size:1.25rem; }
.card-header::before { content:"✨"; }
.mcq-block { padding:20px 4px; }
.question-title { display:flex; gap:10px; align-items:flex-start; }
.question-title::before { content:"🧠"; flex:0 0 auto; }
.option { transition:.18s transform, .18s box-shadow, .18s border-color, .18s background; }
.option:hover { transform:translateY(-2px); }
.option.correct { box-shadow:0 10px 22px rgba(22,163,74,.12); }
.option.wrong { box-shadow:0 10px 22px rgba(231,76,60,.12); }
.progress-pill { display:inline-flex; align-items:center; gap:8px; padding:9px 14px; border-radius:999px; background:rgba(255,255,255,.88); color:var(--secondary); font-weight:900; box-shadow:0 8px 20px rgba(0,0,0,.08); }
.exam-actions .btn-light, .exam-actions .btn-danger { padding:12px 20px; }
.essay-card-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr)); gap:18px; }
.essay-mini-card { border:1px solid var(--border); border-radius:20px; padding:18px; background:linear-gradient(180deg,#fff,rgba(255,255,255,.82)); box-shadow:0 8px 20px rgba(0,0,0,.06); }
.essay-mini-title { font-weight:900; color:var(--secondary); margin:0 0 10px; }
.answer-key { box-shadow:0 16px 34px rgba(0,0,0,.08); }
.key-item { transition:.15s transform; }
.key-item:hover { transform:translateY(-2px); }

@media (max-width:720px) {
  .container { width:min(100% - 20px, 1120px); padding-top:22px; }
  .header-banner { padding:22px 20px; border-radius:22px; }
  .exam-top { display:block; }
  .exam-actions { margin-top:12px; }
  .option-grid { grid-template-columns:1fr; }
  .floating-nav-panel { left:10px; right:10px; justify-content:center; }
}
@media print {
  .floating-nav-panel, .exam-actions, #submitArea, #resetArea { display:none !important; }
  body { background:white !important; }
  .container { width:100%; padding:0; }
  .card { break-inside:avoid; box-shadow:none; }
}

/* ===== BẢO VỆ NỘI DUNG + MÀU GIAO DIỆN THEO MẪU CŨ ===== */
body.theme-g4 {
  --bg1:#e8f8f5;
  --bg2:#d8fff3;
  --primary:#1abc9c;
  --secondary:#0e6251;
  --accent:#ffb84d;
  --border:#a3e4d7;
  --shadow:0 16px 40px rgba(26,188,156,.22);
}
body.theme-g5 {
  --bg1:#f4ecf7;
  --bg2:#fdf2ff;
  --primary:#9b59b6;
  --secondary:#4a235a;
  --accent:#39d3b4;
  --border:#d2b4de;
  --shadow:0 16px 40px rgba(155,89,182,.22);
}
html, body, body * {
  -webkit-user-select:none !important;
  user-select:none !important;
  -webkit-touch-callout:none !important;
}
input, textarea, button, label { -webkit-tap-highlight-color:transparent; }
input, textarea {
  user-select:none !important;
  -webkit-user-select:none !important;
  caret-color:var(--primary);
}
::selection { background:transparent; color:inherit; }
::-moz-selection { background:transparent; color:inherit; }
.option {
  position:relative;
  overflow:hidden;
  border-width:2px;
}
.option::after {
  content:"";
  position:absolute;
  inset:0 auto 0 -65%;
  width:42%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent);
  transform:skewX(-18deg);
  transition:.45s left;
  pointer-events:none;
}
.option:hover::after { left:120%; }
.option.selected {
  border-color:var(--primary);
  background:linear-gradient(180deg, #ffffff, rgba(255,255,255,.78));
  box-shadow:0 10px 24px rgba(0,0,0,.09);
}
.option.correct {
  border-color:#16a34a !important;
  background:#ecfdf5 !important;
  color:#166534;
}
.option.wrong {
  border-color:#e74c3c !important;
  background:#fff1f0 !important;
  color:#b42318;
}
.option.missing {
  border-color:#f59e0b !important;
  background:#fffbeb !important;
}
.security-toast {
  position:fixed;
  left:50%;
  top:24px;
  transform:translateX(-50%) translateY(-12px);
  z-index:999999;
  max-width:min(92vw, 520px);
  padding:12px 18px;
  border-radius:999px;
  background:linear-gradient(135deg, #111827, #374151);
  color:#fff;
  font-weight:900;
  text-align:center;
  box-shadow:0 16px 38px rgba(0,0,0,.25);
  opacity:0;
  transition:.22s ease;
  pointer-events:none;
}
.security-toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.protect-note {
  display:inline-flex;
  gap:8px;
  align-items:center;
  margin-top:12px;
  padding:9px 14px;
  border-radius:999px;
  background:rgba(255,255,255,.88);
  color:var(--secondary);
  font-weight:900;
  box-shadow:0 8px 18px rgba(0,0,0,.08);
}


/* ===== BẢN SẠCH ĐẸP - NỀN NHIỀU MÀU, ÍT GHI CHÚ, KHUNG TỰ LUẬN CHUẨN ===== */
:root {
  --paper: rgba(255,255,255,.78);
  --paper-strong: rgba(255,255,255,.92);
  --soft-1: rgba(26,188,156,.18);
  --soft-2: rgba(56,189,248,.16);
  --soft-3: rgba(251,191,36,.18);
  --soft-4: rgba(244,114,182,.12);
}
body.theme-g5 {
  --paper: rgba(255,255,255,.78);
  --paper-strong: rgba(255,255,255,.92);
  --soft-1: rgba(155,89,182,.18);
  --soft-2: rgba(59,130,246,.13);
  --soft-3: rgba(20,184,166,.16);
  --soft-4: rgba(251,113,133,.13);
}
body {
  background:
    radial-gradient(circle at 9% 12%, var(--soft-1), transparent 28%),
    radial-gradient(circle at 90% 9%, var(--soft-3), transparent 26%),
    radial-gradient(circle at 78% 78%, var(--soft-2), transparent 32%),
    radial-gradient(circle at 18% 86%, var(--soft-4), transparent 30%),
    linear-gradient(135deg, var(--bg1), var(--bg2));
}
body::before {
  background:
    linear-gradient(120deg, transparent 0 43%, rgba(255,255,255,.32) 48%, transparent 53% 100%),
    radial-gradient(circle, rgba(255,255,255,.42) 0 2px, transparent 3px),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.20), transparent 65%);
  background-size: 520px 520px, 110px 110px, 100% 100%;
  opacity: .58;
}
.card {
  background: linear-gradient(180deg, var(--paper-strong), var(--paper));
  border: 1px solid rgba(255,255,255,.72);
  box-shadow: 0 18px 44px rgba(15,23,42,.10);
}
.card-header {
  background:
    linear-gradient(135deg, rgba(255,255,255,.58), rgba(255,255,255,.18)),
    linear-gradient(135deg, color-mix(in srgb, var(--primary) 18%, transparent), color-mix(in srgb, var(--accent) 20%, transparent));
}
.header-banner {
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,.24), transparent 24%),
    radial-gradient(circle at 86% 20%, rgba(255,255,255,.16), transparent 22%),
    linear-gradient(135deg, var(--primary), var(--secondary));
}
.header-banner p.clean-subtitle { max-width: 680px; margin-left:auto; margin-right:auto; }
.hero-chip-row.compact { margin-top: 16px; }
.hero-chip.clean { padding: 8px 13px; background: rgba(255,255,255,.86); }
.protect-note { display:none !important; }
.notice { display:none !important; }
.card-header::before { content:""; display:none; }
.question-title::before { content:""; display:none; }
.mcq-block { padding: 18px 2px; }
.question-title { font-size: 1.06rem; margin-bottom: 12px; }
.option {
  background: linear-gradient(180deg, rgba(255,255,255,.88), rgba(255,255,255,.72));
  border-color: rgba(255,255,255,.76);
  box-shadow: 0 8px 18px rgba(15,23,42,.045);
}
.option.selected { background: linear-gradient(180deg, rgba(255,255,255,.95), color-mix(in srgb, var(--primary) 8%, white)); }
.clean-section-note { display:none !important; }
.essay-card-grid { grid-template-columns: 1fr; gap: 22px; }
.essay-mini-card {
  position: relative;
  overflow: hidden;
  padding: 0;
  border-radius: 26px;
  border: 1px solid rgba(255,255,255,.76);
  background:
    radial-gradient(circle at top right, color-mix(in srgb, var(--primary) 12%, transparent), transparent 36%),
    linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.78));
  box-shadow: 0 16px 34px rgba(15,23,42,.09);
}
.essay-mini-title {
  margin: 0;
  padding: 14px 18px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 15%, white), color-mix(in srgb, var(--accent) 18%, white));
  color: var(--secondary);
  border-bottom: 1px solid rgba(255,255,255,.70);
}
.essay-prompt { padding: 18px 20px 10px; color:#1f2937; font-weight:800; }
.solution-paper {

<script>
const LETTERS = ['A','B','C','D'];
let currentGrade = null;
let currentTest = null;
let currentQuestions = [];
let currentEssays = [];
let navStack = ['landing'];
let navIndex = 0;
const SAVE_VERSION = 'math-only-save-v2';
let autoSaveTimer = null;
let lastGradedWrongIndexes = [];
let scareTimers = [];
let examStartedAt = 0;
let scareActive = false;

let lastSecurityToastTimer = null;

function showSecurityToast(message = '🔒 Hệ thống không cho phép copy, dán hoặc tô đen chữ.'){
  const toast = document.getElementById('securityToast');
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(lastSecurityToastTimer);
  lastSecurityToastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
}
function blockProtectedAction(e, message){
  if (!e) return false;
  e.preventDefault();
  e.stopPropagation();
  if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
  try {
    const sel = window.getSelection && window.getSelection();
    if (sel && sel.removeAllRanges) sel.removeAllRanges();
  } catch (err) {}
  showSecurityToast(message);
  return false;
}
function installContentProtection(){
  const block = (msg) => (e) => blockProtectedAction(e, msg);
  document.addEventListener('copy', block('🔒 Không được sao chép nội dung đề thi.'), true);
  document.addEventListener('cut', block('🔒 Không được cắt nội dung trong hệ thống.'), true);
  document.addEventListener('paste', block('🔒 Không được dán nội dung. Hãy tự nhập câu trả lời.'), true);
  document.addEventListener('contextmenu', block('🔒 Menu chuột phải đã bị khóa.'), true);
  document.addEventListener('selectstart', function(e){
    if (e.target && e.target.closest && e.target.closest('input, textarea, .math-work-editor, .math-line-editor, .input-frac, .frac')) return;
    return blockProtectedAction(e, '🔒 Không được tô đen/chọn chữ trong đề thi.');
  }, true);
  document.addEventListener('dragstart', block('🔒 Không được kéo hoặc copy nội dung đề thi.'), true);
  document.addEventListener('keydown', function(e){
    const key = String(e.key || '').toLowerCase();
    const combo = e.ctrlKey || e.metaKey;
    const editableTarget = e.target && e.target.closest && e.target.closest('input, textarea, .math-work-editor, .math-line-editor');
    if (combo && editableTarget && ['a','z','y'].includes(key)) {
      return;
    }
    if (combo && ['a','c','v','x','s','p','u'].includes(key)) {
      return blockProtectedAction(e, '🔒 Phím tắt sao chép/dán/in/lưu đã bị khóa.');
    }
    if (key === 'printscreen') {
      return blockProtectedAction(e, '🔒 Không được chụp/sao chép nội dung đề thi.');
    }
  }, true);
  ['mouseup','touchend','keyup'].forEach(evt => document.addEventListener(evt, () => {
    try {
      const sel = window.getSelection && window.getSelection();
      if (sel && String(sel).length) sel.removeAllRanges();
    } catch (err) {}
  }, true));
}
installContentProtection();

document.addEventListener('change', function(e){
  const radio = e.target && e.target.matches && e.target.matches('input[type="radio"]') ? e.target : null;
  if (!radio) return;
  document.querySelectorAll(`input[name="${radio.name}"]`).forEach(r => {
    const opt = r.closest('.option');
    if (opt) opt.classList.remove('selected');
  });
  const selectedOption = radio.closest('.option');
  if (selectedOption) selectedOption.classList.add('selected');
}, true);



function getSaveKey(){
  return `${SAVE_VERSION}::grade${currentGrade || 'none'}::test${currentTest || 'none'}`;
}

function clearExamTimers(){
  scareTimers.forEach(id => clearTimeout(id));
  scareTimers = [];
}
function triggerJumpscare(reasonText = 'TẬP TRUNG LÀM BÀI NÀO!', emoji = '👻'){
  const overlay = document.getElementById('scareOverlay');
  if (!overlay || scareActive) return;
  scareActive = true;
  const face = document.getElementById('scareFace');
  const text = document.getElementById('scareText');
  if (face) face.textContent = emoji;
  if (text) text.textContent = reasonText;

function escapeHTMLText(value){
  return String(value || '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
}


function sanitizeMathHTML(html){
  const box = document.createElement('div');
  box.innerHTML = String(html || '');
  const allowedClasses = new Set(['input-frac','frac','num','den']);
  function clean(node){
    Array.from(node.childNodes).forEach(child => {
      if (child.nodeType === Node.ELEMENT_NODE) {
        const tag = child.tagName.toLowerCase();
        if (tag === 'br') return;
        if (tag === 'span') {
          const cls = String(child.getAttribute('class') || '')
            .split(/\s+/)
            .filter(c => allowedClasses.has(c));
          child.setAttribute('class', cls.join(' '));
          Array.from(child.attributes).forEach(attr => {
            if (!['class','contenteditable','data-kind'].includes(attr.name)) child.removeAttribute(attr.name);
          });
          clean(child);
        } else {
          child.replaceWith(document.createTextNode(child.textContent || ''));
        }
      }
    });
  }
  clean(box);
  return box.innerHTML;
}
function getMathEditorContent(editor){
  if (!editor) return '';
  return sanitizeMathHTML(editor.innerHTML || '').trim();
}
function setMathEditorContent(editor, value){
  if (!editor) return;
  const raw = String(value || '');
  if (/<span[^>]*class=["'][^"']*(frac|input-frac)/i.test(raw)) {
    editor.innerHTML = sanitizeMathHTML(raw);
  } else {
    editor.textContent = raw;
  }
}
function renderSavedMath(value){
  const raw = String(value || '').trim();
  if (!raw) return '<span class="empty-work">Chưa nhập</span>';
  if (/<span[^>]*class=["'][^"']*(frac|input-frac)/i.test(raw)) return sanitizeMathHTML(raw);
  return escapeHTMLText(raw);
}

function insertHTMLAtCaret(html){
  const sel = window.getSelection && window.getSelection();
  if (!sel || !sel.rangeCount) return false;
  const range = sel.getRangeAt(0);
  range.deleteContents();
  const temp = document.createElement('div');
  temp.innerHTML = html;
  const frag = document.createDocumentFragment();
  let node, lastNode = null;
  while ((node = temp.firstChild)) lastNode = frag.appendChild(node);
  range.insertNode(frag);
  if (lastNode) {
    range.setStartAfter(lastNode);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
  }
  return true;
}

function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ const t=a%b; a=b; b=t; } return a || 1; }
function frac(n,d){ if(d<0){ n=-n; d=-d; } const g=gcd(n,d); return {n:n/g,d:d/g}; }
function rawF(n,d){ return `<span class="frac"><span class="num">${n}</span><span class="den">${d}</span></span>`; }
function FH(fr){ return rawF(fr.n, fr.d); }
function add(a,b){ return frac(a.n*b.d + b.n*a.d, a.d*b.d); }
function sub(a,b){ return frac(a.n*b.d - b.n*a.d, a.d*b.d); }
function mul(a,b){ return frac(a.n*b.n, a.d*b.d); }
function divf(a,b){ return frac(a.n*b.d, a.d*b.n); }
function cmp(a,b){ const v=a.n*b.d - b.n*a.d; return v>0?'>':(v<0?'<':'='); }
function frawText(n,d){ return rawF(n,d); }
function math(html){ return `<span class="math-inline">${html}</span>`; }
function dec(s){ return `<span class="math-inline">${s}</span>`; }
function unit(s){ return `<span class="math-inline">${s}</span>`; }
function stripHTML(s){ return String(s).replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim(); }
function seededShuffle(arr, seed){
  const a = arr.slice();
  let x = (seed * 9301 + 49297) % 233280;
  for (let i=a.length-1;i>0;i--) {
    x = (x * 9301 + 49297) % 233280;
    const j = x % (i+1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function makeChoices(correctHtml, wrongHtmls, seed){
  const seen = new Set();
  const all = [];
  function addChoice(html, correct){
    const key = stripHTML(html);
    if (!seen.has(key)) { seen.add(key); all.push({html, correct}); }
  }
  addChoice(correctHtml, true);
  wrongHtmls.forEach(w => addChoice(w, false));
  let fill = 1;
  while(all.length < 4){ addChoice(`${stripHTML(correctHtml)} (${fill})`, false); fill++; }
  const shuffled = seededShuffle(all.slice(0,4), seed);
  return {choices: shuffled.map(x=>x.html), answer: shuffled.findIndex(x=>x.correct)};
}
function nearFracChoices(correct, seed, extras=[]){
  const wrong = [];
  extras.forEach(x => wrong.push(FH(x)));
  const c = correct;
  [[c.n+1,c.d],[Math.max(1,c.n-1),c.d],[c.n,c.d+1],[c.n+1,c.d+1],[c.n*2,c.d*2+1],[c.n+2,c.d+2]].forEach(([n,d]) => {
    if (d !== 0 && n > 0) wrong.push(FH(frac(n,d)));
  });
  return makeChoices(FH(c), wrong, seed);
}
function numberChoices(correct, wrongs, suffix, seed){
  return makeChoices(`${correct}${suffix||''}`, wrongs.map(w=>`${w}${suffix||''}`), seed);
}
function decimalChoices(correct, wrongs, seed){ return makeChoices(dec(correct), wrongs.map(dec), seed); }
function textChoices(correct, wrongs, seed){ return makeChoices(correct, wrongs, seed); }
function compareChoices(correct, seed){ return makeChoices(correct, ['>','<','='].filter(x=>x!==correct), seed); }
function addQ(list, text, choiceObj, explain){
  list.push({text, choices: choiceObj.choices, answer: choiceObj.answer, explain: explain || ''});
}
function addFracOp(list, label, a, op, b, correct, seed){
  const sym = op;
  addQ(list, `${label}: Tính ${math(FH(a))} ${sym} ${math(FH(b))}.`, nearFracChoices(correct, seed), `Kết quả đúng là ${FH(correct)}.`);
}
function addSimplify(list, n,d, seed){
  const correct = frac(n,d);
  addQ(list, `Rút gọn phân số ${math(rawF(n,d))} được phân số nào?`, nearFracChoices(correct, seed), `${rawF(n,d)} rút gọn bằng ${FH(correct)}.`);
}
function addEquivalent(list, n,d,k, seed){
  const base=frac(n,d);
  const correct=rawF(base.n*k, base.d*k);
  const wrong=[rawF(base.n*k, base.d*k+1), rawF(base.n*k+1, base.d*k), rawF(base.n*(k+1), base.d*k), rawF(base.n*k-1, base.d*k)];
  addQ(list, `Phân số nào dưới đây bằng ${math(FH(base))}?`, makeChoices(correct, wrong, seed), `${FH(base)} nhân cả tử số và mẫu số với ${k} được ${correct}.`);
}
function addCompareFrac(list, a,b, seed){
  const c=cmp(a,b);
  addQ(list, `Điền dấu thích hợp: ${math(FH(a))} ... ${math(FH(b))}.`, compareChoices(c, seed), `${FH(a)} ${c} ${FH(b)}.`);
}
function addFractionOf(list, f, total, seed, suffix){
  const value = f.n * total / f.d;
  const wrong=[value+1, value-1, value+2, Math.max(1,value-2)].map(x => Number.isInteger(x) ? x : x.toFixed(1).replace('.',','));
  addQ(list, `${math(FH(f))} của ${total}${suffix||''} là bao nhiêu?`, numberChoices(value, wrong, suffix||'', seed), `${total} × ${FH(f)} = ${value}${suffix||''}.`);
}
function addExpressionFrac(list, exprHtml, correct, seed){
  addQ(list, `Tính giá trị biểu thức: ${exprHtml}.`, nearFracChoices(correct, seed), `Giá trị đúng là ${FH(correct)}.`);
}
function addCompareResults(list, leftHtml, rightHtml, correctSign, seed, explain){
  addQ(list, `So sánh kết quả hai vế: ${leftHtml} ... ${rightHtml}.`, compareChoices(correctSign, seed), explain || `Dấu đúng là ${correctSign}.`);
}
function withSeed(base, idx){ return base*100 + idx*7 + 13; }

function buildG4FractionExam(t){
  const qs=[]; let s=t*1000;
  if (t===1) {
    addEquivalent(qs,3,4,3,++s); addSimplify(qs,8,12,++s); addCompareFrac(qs, frac(5,6), frac(7,9), ++s);
    addFracOp(qs,'Câu 4', frac(3,8), '+', frac(2,8), add(frac(3,8),frac(2,8)), ++s);
    addFracOp(qs,'Câu 5', frac(7,10), '-', frac(3,10), sub(frac(7,10),frac(3,10)), ++s);
    addFracOp(qs,'Câu 6', frac(1,3), '+', frac(1,6), add(frac(1,3),frac(1,6)), ++s);
    addFracOp(qs,'Câu 7', frac(5,6), '-', frac(1,4), sub(frac(5,6),frac(1,4)), ++s);
    addFracOp(qs,'Câu 8', frac(2,5), '×', frac(3,4), mul(frac(2,5),frac(3,4)), ++s);
    addFracOp(qs,'Câu 9', frac(3,5), ':', frac(2,3), divf(frac(3,5),frac(2,3)), ++s);
    addExpressionFrac(qs, `${math(FH(frac(1,2)))} + ${math(FH(frac(2,3)))} × ${math(FH(frac(3,4)))}`, add(frac(1,2), mul(frac(2,3),frac(3,4))), ++s);
    addCompareResults(qs, `${math(FH(frac(2,3)))} + ${math(FH(frac(1,6)))}`, `${math(FH(frac(5,6)))}`, '=', ++s, `${FH(frac(2,3))} + ${FH(frac(1,6))} = ${FH(frac(5,6))}.`);
    addQ(qs, `Tìm số tự nhiên x biết ${math(rawF(3,'x'))} = ${math(rawF(6,14))}.`, numberChoices(7,[6,8,9,12],'',++s), `Vì ${rawF(3,7)} = ${rawF(6,14)} nên x = 7.`);
    addSimplify(qs,12,18,++s); addQ(qs, `Trong các phân số sau, phân số nào nhỏ nhất?`, makeChoices(FH(frac(3,8)), [FH(frac(4,9)),FH(frac(5,12)),FH(frac(2,5))], ++s), `${FH(frac(3,8))} là phân số nhỏ nhất trong bốn lựa chọn.`);
    addQ(qs, `Trong các phân số sau, phân số nào lớn nhất?`, makeChoices(FH(frac(7,9)), [FH(frac(5,7)),FH(frac(3,4)),FH(frac(6,8))], ++s), `${FH(frac(7,9))} là lớn nhất.`);
    addFractionOf(qs, frac(4,5), 20, ++s, ' quyển vở'); addSimplify(qs,15,25,++s);

  addQ(qs, `Tính: ${timeChoices[0]} = ?`, textChoices(timeChoices[1], timeChoices[2], ++s), `Đổi ra giây rồi chia.`);
  const tri=[['25','12','150'],['18','14','126'],['30','16','240'],['22','15','165']][idx];
  addQ(qs, `Một hình tam giác có cạnh đáy dài ${tri[0]} cm, chiều cao ${tri[1]} cm. Diện tích là:`, numberChoices(tri[2],[Number(tri[2])+10, Number(tri[2])-10, Number(tri[0])*Number(tri[1])],' cm²',++s), `Diện tích tam giác = đáy × chiều cao : 2.`);
  const circle=[['15','94,2'],['10','62,8'],['12','75,36'],['8','50,24']][idx];
  addQ(qs, `Một hình tròn có bán kính ${circle[0]} cm. Chu vi hình tròn là:`, decimalChoices(circle[1],[String(Number(circle[1].replace(',','.'))/2).replace('.',','), String(Number(circle[1].replace(',','.'))+3.14).replace('.',','), String(Number(circle[1].replace(',','.'))-3.14).replace('.',',')], ++s), `Chu vi hình tròn = bán kính × 2 × 3,14.`);
  const cube=[['4,5','91,125'],['3,5','42,875'],['2,5','15,625'],['5','125']][idx];
  addQ(qs, `Một hình lập phương có cạnh là ${dec(cube[0])} dm. Thể tích là:`, decimalChoices(cube[1],[cube[0].replace(',','')+',25', cube[0], String(Number(cube[1].replace(',','.'))+1).replace('.',',')], ++s), `Thể tích hình lập phương = cạnh × cạnh × cạnh.`);
  const decimalFracData = [
    {from: frac(3,5), correct: frac(6,10), wrong:[frac(3,10), frac(30,100), frac(5,10)]},
    {from: frac(7,20), correct: frac(35,100), wrong:[frac(7,100), frac(70,100), frac(35,10)]},
    {from: frac(3,4), correct: frac(75,100), wrong:[frac(6,10), frac(30,100), frac(4,10)]},
    {from: frac(9,25), correct: frac(36,100), wrong:[frac(9,100), frac(90,100), frac(36,10)]}
  ][idx];
  addQ(qs, `Chuyển phân số ${math(FH(decimalFracData.from))} thành phân số thập phân.`, makeChoices(FH(decimalFracData.correct), decimalFracData.wrong.map(FH), ++s), `Nhân cả tử và mẫu để được mẫu số 10 hoặc 100: ${FH(decimalFracData.from)} = ${FH(decimalFracData.correct)}.`);
  const tank=[['2','1,5','1','3000'],['2,5','1,2','1','3000'],['3','1,5','1','4500'],['2','2','1,25','5000']][idx];
  addQ(qs, `Một bể nước hình hộp chữ nhật dài ${tank[0]} m, rộng ${tank[1]} m, cao ${tank[2]} m. Bể chứa được bao nhiêu lít nước?`, numberChoices(tank[3],[Number(tank[3])/10, Number(tank[3])+500, Number(tank[3])-500],' lít',++s), `Tính thể tích theo m³ rồi đổi 1 m³ = 1000 lít.`);
  const avg=[['3,2','4,4','5,6','4,4'],['2,5','3,7','4,9','3,7'],['6,1','7,3','8,5','7,3'],['1,8','2,6','3,4','2,6']][idx];
  addQ(qs, `Trung bình cộng của ${dec(avg[0])}, ${dec(avg[1])}, ${dec(avg[2])} là:`, decimalChoices(avg[3],[avg[0],avg[1],avg[2]],++s), `Tổng ba số chia cho 3.`);
  addQ(qs, `${dec(['2,75','3,4','5,06','7,5'][idx])} m = ... cm`, numberChoices([275,340,506,750][idx], [[27.5,34,50.6,75][idx], [2750,3400,5060,7500][idx], [285,350,516,760][idx]], ' cm', ++s), `1 m = 100 cm.`);
  addQ(qs, `${dec(['1,25','2,5','3,75','4,2'][idx])} kg = ... g`, numberChoices([1250,2500,3750,4200][idx], [[125,250,375,420][idx], [1205,2050,3705,4020][idx], [12500,25000,37500,42000][idx]], ' g', ++s), `1 kg = 1000 g.`);
  addCompareResults(qs, `${dec(decBase)} × 10`, `${dec(['32,6','40,8','57,5','60,4'][idx])}`, '=', ++s);
  const halfSum = [
    ["3,76",["3,66","3,86","3,75"]],
    ["4,58",["4,48","4,68","4,508"]],
    ["6,25",["6,15","6,35","5,75"]],
    ["6,54",["6,44","6,64","6,504"]]
  ][idx];
  addQ(qs, `Giá trị của biểu thức ${dec(decBase)} + ${math(FH(frac(1,2)))} là:`, decimalChoices(halfSum[0], halfSum[1], ++s), `Đổi ${FH(frac(1,2))} = 0,5 rồi cộng.`);
  return {questions: qs.slice(0,22), essay: {
    prompt: `Một mảnh vườn đã trồng rau trên ${math(rawF(2+idx,5+idx))} diện tích. Sau đó trồng thêm ${math(rawF(1,10))} diện tích. Hỏi đã trồng rau trên bao nhiêu phần diện tích mảnh vườn?`,
    solution: `Phần diện tích đã trồng rau là: ${math(rawF(2+idx,5+idx))} + ${math(rawF(1,10))} = ${math(FH(add(frac(2+idx,5+idx), frac(1,10))))}. Đáp số: ${math(FH(add(frac(2+idx,5+idx), frac(1,10))))} diện tích mảnh vườn.`
  }};
}


function padTo30(grade, test, exam){
  const qs = exam.questions.slice();
  const essays = [];
  if (exam.essay) essays.push(exam.essay);
  if (Array.isArray(exam.essays)) exam.essays.forEach(e => essays.push(e));
  const s0 = grade * 10000 + test * 1000;
  if (grade === 4 && test <= 2) addGrade4FractionExtras(qs, test, s0);
  if (grade === 4 && test >= 3) addGrade4MixedExtras(qs, test, s0);
  if (grade === 5 && test <= 2) addGrade5EarlyExtras(qs, test, s0);
  if (grade === 5 && test >= 3) addGrade5MixedExtras(qs, test, s0);
  while (qs.length < 30) {
    const k = qs.length + 1;
    const a = frac((grade + test + k) % 7 + 2, (grade + k) % 9 + 5);
    const b = frac((test + k) % 5 + 1, (grade + test + k) % 8 + 6);
    const val = add(a,b);
    addQ(qs, `Tính thêm: ${math(FH(a))} + ${math(FH(b))} = ?`, nearFracChoices(val, s0+k), `Quy đồng rồi cộng tử số, kết quả là ${FH(val)}.`);
  }
  if (essays.length < 2) essays.push(makeSecondEssay(grade, test));
  return {questions: qs.slice(0,30), essays: essays.slice(0,2)};
}

function addGrade4FractionExtras(qs, t, s){
  const sets = t === 1 ? [
    ['simplify',18,24], ['eq',5,7,4], ['compare',frac(7,12),frac(5,8)], ['op','+',frac(5,12),frac(1,8)],
    ['op','-',frac(9,10),frac(2,5)], ['op','×',frac(4,9),frac(3,8)], ['op',':',frac(5,6),frac(10,9)], ['expr']
  ] : [
    ['simplify',21,28], ['eq',2,9,5], ['compare',frac(11,15),frac(7,10)], ['op','+',frac(7,18),frac(5,12)],
    ['op','-',frac(13,16),frac(3,8)], ['op','×',frac(7,10),frac(5,14)], ['op',':',frac(9,11),frac(3,22)], ['expr']
  ];
  sets.forEach((it, idx) => {
    const seed = s + idx + 1;
    if (it[0] === 'simplify') addSimplify(qs, it[1], it[2], seed);
    if (it[0] === 'eq') addEquivalent(qs, it[1], it[2], it[3], seed);
    if (it[0] === 'compare') addCompareFrac(qs, it[1], it[2], seed);
    if (it[0] === 'op') {
      const a=it[2], b=it[3];
      const val = it[1] === '+' ? add(a,b) : it[1] === '-' ? sub(a,b) : it[1] === '×' ? mul(a,b) : divf(a,b);
      addFracOp(qs, `Câu ${qs.length+1}`, a, it[1], b, val, seed);
    }
    if (it[0] === 'expr') {
      const val = sub(add(frac(3,5), frac(1,4)), frac(1,10));
      addExpressionFrac(qs, `${math(FH(frac(3,5)))} + ${math(FH(frac(1,4)))} - ${math(FH(frac(1,10)))}`, val, seed);
    }
  });
}

function addGrade4MixedExtras(qs, t, s){
  const idx = t - 3;
  const mixed = [
    () => addQ(qs, `${math(rawF(3,10))} m = ... cm`, numberChoices(30,[3,300,13],' cm',s+1), `1 m = 100 cm nên ${rawF(3,10)} m = 30 cm.`),
    () => addQ(qs, `${math(rawF(3,4))} giờ = ... phút`, numberChoices(45,[30,60,75],' phút',s+2), `1 giờ = 60 phút nên ${rawF(3,4)} giờ = 45 phút.`),
    () => addQ(qs, `Trung bình cộng của ${18+idx*2}, ${26+idx*2}, ${34+idx*2}, ${42+idx*2} là:`, numberChoices(30+idx*2,[29+idx*2,31+idx*2,120+idx*8],'',s+3), `Tổng bốn số chia cho 4.`),
    () => addQ(qs, `${4+idx} tạ ${15+idx*5} kg = ... kg`, numberChoices((4+idx)*100+15+idx*5,[(4+idx)*10+15+idx*5,(4+idx)*1000+15+idx*5,(4+idx)*100+25+idx*5],' kg',s+4), `1 tạ = 100 kg.`),
    () => addQ(qs, `Một sân hình chữ nhật dài ${24+idx} m, rộng ${8+idx} m. Chu vi sân là:`, numberChoices(2*((24+idx)+(8+idx)),[(24+idx)*(8+idx),(24+idx)+(8+idx),2*((24+idx)+(8+idx))+4],' m',s+5), `Chu vi hình chữ nhật = (dài + rộng) × 2.`),
    () => addCompareResults(qs, `${math(FH(frac(2,5)))} + ${math(FH(frac(1,10)))}`, `${math(FH(frac(1,2)))}`, '=', s+6, `${FH(frac(2,5))} + ${FH(frac(1,10))} = ${FH(frac(1,2))}.`),
    () => addExpressionFrac(qs, `${math(FH(frac(5,6)))} - (${math(FH(frac(1,3)))} + ${math(FH(frac(1,12)))})`, sub(frac(5,6), add(frac(1,3),frac(1,12))), s+7),
    () => addQ(qs, `Số ${['4 305 018','7 020 604','8 916 230','6 004 705'][idx]} có chữ số hàng triệu là:`, numberChoices([4,7,8,6][idx],[[3,2,9,0][idx],[5,0,1,4][idx],[0,6,2,7][idx]],'',s+8), `Chữ số đầu tiên bên trái là chữ số hàng triệu.`)
  ];
  mixed.forEach(fn => fn());
}

function addGrade5EarlyExtras(qs, t, s){
  const data = t === 1 ? {
    d:'3,26', e:'1,75', prod:'5,705', div:'1,63', speed:42, time:'2,5', dist:'105', fracA:frac(5,12), fracB:frac(7,18)
  } : {
    d:'4,35', e:'2,08', prod:'9,048', div:'2,175', speed:48, time:'1,75', dist:'84', fracA:frac(7,15), fracB:frac(2,9)
  };
  addQ(qs, `Tính: ${dec(data.d)} × ${dec(data.e)} = ?`, decimalChoices(data.prod, [t===1?'5,750':'9,408', t===1?'5,795':'9,480', t===1?'57,05':'90,48', t===1?'4,705':'8,048'], s+1), `Nhân số thập phân rồi đếm chữ số ở phần thập phân.`);
  addQ(qs, `Tính: ${dec(t===1?'6,52':'8,70')} : 2 = ?`, decimalChoices(data.div, [t===1?'3,26':'4,35', t===1?'1,36':'2,075', t===1?'13,04':'17,40'], s+2), `Chia số thập phân như chia số tự nhiên, đặt dấu phẩy đúng vị trí.`);
  addCompareResults(qs, `${dec(data.d)} × 100`, `${dec(t===1?'326':'435')}`, '=', s+3);
  addExpressionFrac(qs, `${math(FH(data.fracA))} + ${math(FH(data.fracB))} : ${math(FH(frac(2,3)))}`, add(data.fracA, divf(data.fracB, frac(2,3))), s+4);
  addQ(qs, `Một người đi với vận tốc ${data.speed} km/giờ trong ${dec(data.time)} giờ. Quãng đường là:`, decimalChoices(data.dist, [t===1?'104':'82', t===1?'107':'86', t===1?'16,8':'27,4'], s+5), `Quãng đường = vận tốc × thời gian.`);
  addQ(qs, `Viết ${math(rawF(t===1?13:27,10))} dưới dạng số thập phân.`, decimalChoices(t===1?'1,3':'2,7',[t===1?'0,13':'0,27',t===1?'13,0':'27,0',t===1?'1,03':'2,07'],s+6), `Mẫu số 10 nên viết một chữ số ở phần thập phân.`);
  addQ(qs, `So sánh: ${dec(t===1?'3,260':'4,350')} ... ${dec(data.d)}.`, compareChoices('=', s+7), `Thêm chữ số 0 tận cùng bên phải phần thập phân không làm đổi giá trị số.`);
  addQ(qs, `Một xe đi 90 km trong 2,5 giờ. Vận tốc của xe là:`, decimalChoices('36',[ '35','37','225'], s+8), `Vận tốc = quãng đường : thời gian = 90 : 2,5 = 36 km/giờ.`);
}

function addGrade5MixedExtras(qs, t, s){
  const idx = t - 3;
  const tri = [['28','15','210'],['24','18','216'],['32','20','320'],['26','16','208']][idx];
  addQ(qs, `Một hình tam giác có đáy ${tri[0]} cm, chiều cao ${tri[1]} cm. Diện tích là:`, numberChoices(tri[2],[Number(tri[2])+12, Number(tri[2])-12, Number(tri[0])*Number(tri[1])],' cm²',s+1), `Diện tích tam giác = đáy × chiều cao : 2.`);
  addQ(qs, `Tính: ${['6 phút 24 giây : 8','7 phút 30 giây : 9','8 phút 20 giây : 10','9 phút 15 giây : 5'][idx]} = ?`, textChoices(['48 giây','50 giây','50 giây','1 phút 51 giây'][idx], [['46 giây','52 giây','54 giây'],['45 giây','55 giây','60 giây'],['45 giây','55 giây','60 giây'],['1 phút 45 giây','1 phút 55 giây','111 phút']][idx], s+2), `Đổi toàn bộ ra giây, thực hiện phép chia rồi đổi lại nếu cần.`);
  addQ(qs, `Một hình thang có hai đáy ${18+idx*2} cm và ${12+idx*2} cm, chiều cao ${8+idx} cm. Diện tích là:`, numberChoices((18+idx*2+12+idx*2)*(8+idx)/2,[(18+idx*2)*(12+idx*2), (18+idx*2+12+idx*2)*(8+idx), (18+idx*2+12+idx*2)*(8+idx)/2+10],' cm²',s+3), `Diện tích hình thang = (đáy lớn + đáy bé) × chiều cao : 2.`);
  addQ(qs, `Một hình hộp chữ nhật dài ${dec(['2,4','3,2','2,5','4,1'][idx])} m, rộng ${dec(['1,5','1,25','2','1,2'][idx])} m, cao ${dec(['1','1','1,2','1,5'][idx])} m. Thể tích là:`, decimalChoices(['3,6','4','6','7,38'][idx], [['3,9','3,0','36'],['4,45','3,2','40'],['5','7','60'],['7,28','7,48','73,8']][idx], s+4), `Thể tích = dài × rộng × cao.`);
  addQ(qs, `Chuyển ${math(FH([frac(7,25),frac(11,20),frac(9,50),frac(13,25)][idx]))} thành số thập phân.`, decimalChoices(['0,28','0,55','0,18','0,52'][idx], [['0,27','0,35','2,8'],['0,50','0,505','5,5'],['0,09','0,19','1,8'],['0,50','0,62','5,2']][idx], s+5), `Đưa về phân số thập phân rồi viết thành số thập phân.`);
  addExpressionFrac(qs, `${math(FH(frac(4,5)))} : ${math(FH(frac(2,3)))} - ${math(FH(frac(1,6)))}`, sub(divf(frac(4,5),frac(2,3)), frac(1,6)), s+6);
  addCompareResults(qs, `${dec(['3,26','4,08','5,75','6,04'][idx])} × 1000`, `${dec(['3260','4080','5750','6040'][idx])}`, '=', s+7);
  addQ(qs, `Trung bình cộng của ${dec(['2,4','3,6','4,8','5,2'][idx])}, ${dec(['3,6','4,8','5,4','6,4'][idx])}, ${dec(['5,4','6,0','7,2','8,0'][idx])} là:`, decimalChoices(['3,8','4,8','5,8','6,53'][idx], [['3,7','3,9','11,4'],['4,7','4,9','14,4'],['5,7','5,9','17,4'],['6,43','6,63','19,6']][idx], s+8), `Tổng các số chia cho số lượng số hạng.`);
}

function makeSecondEssay(grade, test){
  if (grade === 4 && test <= 2) {
    return test === 1 ? {
      prompt: `Một thùng có ${math(rawF(7,8))} kg đường. Người ta dùng ${math(rawF(1,4))} kg để làm bánh và ${math(rawF(1,8))} kg để pha nước. Hỏi trong thùng còn lại bao nhiêu ki-lô-gam đường?`,
      solution: `Số đường đã dùng: ${math(rawF(1,4))} + ${math(rawF(1,8))} = ${math(rawF(3,8))} kg. Số đường còn lại: ${math(rawF(7,8))} - ${math(rawF(3,8))} = ${math(rawF(4,8))} = ${math(rawF(1,2))} kg. Đáp số: ${math(rawF(1,2))} kg.`
    } : {
      prompt: `Một đoạn dây dài ${math(rawF(5,6))} m. Lan cắt đi ${math(rawF(1,3))} m, sau đó cắt tiếp ${math(rawF(1,12))} m. Hỏi đoạn dây còn lại dài bao nhiêu mét?`,
      solution: `Độ dài đã cắt: ${math(rawF(1,3))} + ${math(rawF(1,12))} = ${math(rawF(5,12))} m. Độ dài còn lại: ${math(rawF(5,6))} - ${math(rawF(5,12))} = ${math(rawF(10,12))} - ${math(rawF(5,12))} = ${math(rawF(5,12))} m. Đáp số: ${math(rawF(5,12))} m.`
    };
  }
  if (grade === 4) {
    return {
      prompt: `Một cửa hàng nhập về 360 kg gạo. Ngày thứ nhất bán được ${math(rawF(2,5))} số gạo, ngày thứ hai bán được ${math(rawF(1,4))} số gạo ban đầu. Hỏi cửa hàng còn lại bao nhiêu ki-lô-gam gạo?`,
      solution: `Ngày thứ nhất bán: 360 × ${math(rawF(2,5))} = 144 kg. Ngày thứ hai bán: 360 × ${math(rawF(1,4))} = 90 kg. Còn lại: 360 - 144 - 90 = 126 kg. Đáp số: 126 kg.`
    };
  }
  if (grade === 5 && test <= 2) {
    return test === 1 ? {
      prompt: `Một ô tô đi từ A lúc 7 giờ 30 phút với vận tốc 48 km/giờ. Sau 2,5 giờ ô tô đến B. Hỏi quãng đường AB dài bao nhiêu ki-lô-mét và ô tô đến B lúc mấy giờ?`,
      solution: `Quãng đường AB: 48 × 2,5 = 120 km. Thời điểm đến B: 7 giờ 30 phút + 2 giờ 30 phút = 10 giờ. Đáp số: 120 km; 10 giờ.`
    } : {
      prompt: `Một xe máy đi quãng đường 84 km trong 2,4 giờ. Hỏi vận tốc trung bình của xe máy là bao nhiêu km/giờ?`,
      solution: `Vận tốc trung bình = quãng đường : thời gian = 84 : 2,4 = 35 km/giờ. Đáp số: 35 km/giờ.`
    };
  }
  return {
    prompt: `Một bể nước hình hộp chữ nhật dài 2,5 m, rộng 1,6 m, cao 1,2 m. Bể đang chứa ${math(rawF(3,5))} thể tích nước. Hỏi trong bể có bao nhiêu lít nước? Biết 1 m³ = 1000 lít.`,
    solution: `Thể tích bể: 2,5 × 1,6 × 1,2 = 4,8 m³. Lượng nước trong bể: 4,8 × ${math(rawF(3,5))} = 2,88 m³ = 2880 lít. Đáp số: 2880 lít.`
  };
}

function buildExam(grade, test){
  let exam;
  if (grade === 4) {
    exam = test <= 2 ? buildG4FractionExam(test) : buildG4MixedExam(test);
  } else {
    exam = test <= 2 ? buildG5EarlyExam(test) : buildG5MixedExam(test);
  }
  return padTo30(grade, test, exam);
}
function show(view){
  document.getElementById('viewLanding').classList.toggle('hidden', view !== 'landing');
  document.getElementById('viewTests').classList.toggle('hidden', view !== 'tests');
  document.getElementById('viewExam').classList.toggle('hidden', view !== 'exam');
  updateNavLabel(view);
}
function pushNav(view){
  if (navStack[navIndex] === view) { updateNavLabel(view); return; }
  navStack = navStack.slice(0, navIndex+1);
  navStack.push(view);
  navIndex = navStack.length - 1;
  updateNavLabel(view);
}
function updateNavLabel(view){
  let label = 'Trang chủ';
  if (view === 'tests') label = currentGrade ? `Lớp ${currentGrade} - Toán` : 'Danh sách đề';
  if (view === 'exam') label = currentGrade && currentTest ? `Đề ${currentTest}` : 'Làm bài';
  document.getElementById('navStateLabel').textContent = label;
  document.getElementById('navBackBtn').disabled = navIndex <= 0;
  document.getElementById('navForwardBtn').disabled = navIndex >= navStack.length - 1;
}
function selectGrade(grade){
  currentGrade = grade;
  document.body.classList.remove('theme-g4','theme-g5');

}

function goHome(){ saveCurrentWork(false); clearExamTimers(); currentTest=null; document.body.classList.remove('theme-g4','theme-g5'); show('landing'); pushNav('landing'); }
function navBack(){ if (navIndex > 0){ navIndex--; show(navStack[navIndex]); } }
function navForward(){ if (navIndex < navStack.length - 1){ navIndex++; show(navStack[navIndex]); } }
function startExam(test){
  currentTest = test;
  const exam = buildExam(currentGrade, currentTest);
  currentQuestions = exam.questions;
  currentEssays = Array.isArray(exam.essays) ? exam.essays : [exam.essay].filter(Boolean);
  document.getElementById('examTitle').textContent = `Đề ${test} - Toán Lớp ${currentGrade}`;
  document.getElementById('examSubtitle').textContent = `${currentQuestions.length} câu trắc nghiệm • ${currentEssays.length} bài tự luận`;
  renderExam();
  applySavedWork();
  startExamTimers();
  document.getElementById('scoreDisplay').classList.add('hidden');
  document.getElementById('wrongReview').classList.add('hidden');
  document.getElementById('teacherEssayView').classList.add('hidden');
  document.getElementById('answerKey').classList.add('hidden');
  document.getElementById('resetArea').classList.remove('hidden');
  document.getElementById('submitArea').classList.remove('hidden');
  show('exam'); pushNav('exam');
}

function essayStepHTML(essayIdx, stepNo){
  const uid = `${essayIdx}_${stepNo}_${Date.now()}_${Math.floor(Math.random()*1000)}`;
  return `
    <div class="solution-step" data-step="${stepNo}">
      <div class="solution-combo-title">
        <span>Lời giải ${stepNo}</span>
        <button type="button" class="solution-delete-btn" title="Xóa lời giải này" onclick="removeEssayDynamicBlock(this)">×</button>
      </div>
      <div class="solution-pair-grid">
        <div class="solution-field">
          <div class="solution-label">Lời giải</div>
          <input id="essayReason_${uid}" type="text" placeholder="Viết lời giải trên một hàng riêng..." />
        </div>
        <div class="solution-field">
          <div class="solution-label">Phép tính</div>
          <div id="essayCalc_${uid}" class="math-work-editor" contenteditable="true" data-placeholder="Nhập phép tính, có thể chèn phân số rồi viết tiếp số hoặc dấu..."></div>
        </div>
      </div>
    </div>`;
}
function essayAnswerHTML(essayIdx, ansNo){
  const uid = `${essayIdx}_${ansNo}_${Date.now()}_${Math.floor(Math.random()*1000)}`;
  return `
    <div class="answer-step" data-answer="${ansNo}">
      <div class="solution-label">Đáp số ${ansNo}</div>
      <div id="essayAnswer_${uid}" class="math-work-editor" contenteditable="true" data-placeholder="Nhập đáp số, có thể chèn phân số..."></div>
      <button type="button" class="solution-delete-btn" title="Xóa đáp số này" onclick="removeEssayDynamicBlock(this)">×</button>
    </div>`;
}
function addEssayStepBlock(essayIdx){
  const box = document.getElementById(`essaySteps${essayIdx}`);
  if (!box) return;
  const next = box.querySelectorAll('.solution-step').length + 1;
  box.insertAdjacentHTML('beforeend', essayStepHTML(essayIdx, next));
  renumberEssayBlocks(essayIdx);
  const last = box.lastElementChild;
  if (last) {
    const firstInput = last.querySelector('input');
    if (firstInput) firstInput.focus();
  }
}
function addEssayAnswerBlock(essayIdx){
  const box = document.getElementById(`essayAnswers${essayIdx}`);
  if (!box) return;
  const next = box.querySelectorAll('.answer-step').length + 1;
  box.insertAdjacentHTML('beforeend', essayAnswerHTML(essayIdx, next));
  renumberEssayBlocks(essayIdx);
  const last = box.lastElementChild;
  if (last) {
    const firstInput = last.querySelector('input');
    if (firstInput) firstInput.focus();
  }
}
function removeEssayDynamicBlock(btn){
  const block = btn.closest('.solution-step, .answer-step');
  if (!block) return;
  const paper = btn.closest('.solution-paper');
  block.remove();
  if (paper) {
    const stepBox = paper.querySelector('.solution-steps');
    const idx = stepBox ? Number(stepBox.id.replace('essaySteps','')) : 0;
    renumberEssayBlocks(idx);
  }
}
function renumberEssayBlocks(essayIdx){
  const stepBox = document.getElementById(`essaySteps${essayIdx}`);
  if (stepBox) {
    stepBox.querySelectorAll('.solution-step').forEach((step, i) => {
      step.dataset.step = String(i + 1);
      const title = step.querySelector('.solution-combo-title span');
      if (title) title.textContent = `Lời giải ${i + 1}`;
    });
  }
  const answerBox = document.getElementById(`essayAnswers${essayIdx}`);
  if (answerBox) {
    answerBox.querySelectorAll('.answer-step').forEach((ans, i) => {
      ans.dataset.answer = String(i + 1);
      const label = ans.querySelector('.solution-label');
      if (label) label.textContent = `Đáp số ${i + 1}`;
    });
  }
}

function renderExam(){
  const root = document.getElementById('examRoot');
  const qsHtml = currentQuestions.map((q, i) => `
    <div class="mcq-block" data-index="${i}">
      <p class="question-title">Câu ${i+1}: ${q.text}</p>
      <div class="option-grid">
        ${q.choices.map((c, j) => `
          <label class="option" data-q="${i}" data-opt="${j}">
            <input type="radio" name="q${i}" value="${j}" ${j === q.answer ? 'data-correct="true"' : ''} />
            <span><span class="letter">${LETTERS[j]}.</span> ${c}</span>
          </label>`).join('')}
      </div>
    </div>`).join('');
  root.innerHTML = `
    <div class="card">
      <div class="card-header">Phần 1: Trắc nghiệm</div>
      <div class="card-body">${qsHtml}</div>
    </div>
    <div class="card">
      <div class="card-header">Phần 2: Bài giải tự luận</div>
      <div class="card-body">
        <div class="essay-card-grid">
          ${currentEssays.map((essay, idx) => `
            <div class="essay-mini-card">
              <p class="essay-mini-title">Bài ${idx + 1}</p>
              <div class="essay-prompt">${essay.prompt}</div>
              <div class="solution-paper">
                <div class="solution-title">BÀI GIẢI</div>
                <div class="solution-toolbar">
                  <button type="button" class="solution-action-btn" onclick="addEssayStepBlock(${idx})">+ Thêm hàng làm bài</button>
                  <button type="button" class="solution-action-btn fraction" onclick="insertFractionIntoEssay(${idx})">+ Chèn phân số</button>
                  <button type="button" class="solution-action-btn answer" onclick="addEssayAnswerBlock(${idx})">+ Thêm đáp số</button>
                </div>
                <div class="solution-steps" id="essaySteps${idx}">${essayStepHTML(idx, 1)}</div>
                <div class="empty-solution-hint">Bấm “Thêm lời giải” để thêm dòng làm bài.</div>
                <div class="answer-list" id="essayAnswers${idx}">${essayAnswerHTML(idx, 1)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>
    </div>`;
}
function gradeExam(){
  let correct = 0;
  let answered = 0;
  const wrongIndexes = [];
  saveCurrentWork(false);
  currentQuestions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const opts = document.querySelectorAll(`.option[data-q="${i}"]`);
    const block = document.querySelector(`.mcq-block[data-index="${i}"]`);
    opts.forEach(o => o.classList.remove('correct','wrong','missing','locked-correct'));
    if (block) block.classList.remove('needs-redo','done-correct');
    if (selected) {
      answered++;
      const val = Number(selected.value);
      if (selected.getAttribute('data-correct') === 'true' || val === q.answer) {
        correct++;
        if (opts[val]) opts[val].classList.add('correct','locked-correct');
        if (block) block.classList.add('done-correct');
        opts.forEach(opt => {
          const input = opt.querySelector('input[type="radio"]');
          if (input) input.disabled = true;
        });
      } else {
        wrongIndexes.push(i);
        if (opts[val]) opts[val].classList.add('wrong');
        if (block) block.classList.add('needs-redo');
        opts.forEach(opt => {
          const input = opt.querySelector('input[type="radio"]');
          if (input) input.disabled = false;
        });
      }
    } else {
      wrongIndexes.push(i);
      opts.forEach(o => o.classList.add('wrong'));
      if (block) block.classList.add('needs-redo');
      opts.forEach(opt => {
        const input = opt.querySelector('input[type="radio"]');
        if (input) input.disabled = false;
      });
    }
  });
  lastGradedWrongIndexes = wrongIndexes;
  const percent = Math.round(correct / currentQuestions.length * 100);
  const scoreDisplay = document.getElementById('scoreDisplay');
  scoreDisplay.className = 'score-card-clean ' + (wrongIndexes.length === 0 ? 'perfect' : (wrongIndexes.length > 2 ? 'warning' : ''));
  scoreDisplay.innerHTML = `<h2 style="margin:0 0 8px;color:var(--secondary);">Kết quả: ${correct}/${currentQuestions.length} câu đúng (${percent}%)</h2><div>Câu đúng tô xanh. Câu sai hoặc chưa làm tô đỏ và có thể làm lại.</div>`;
  scoreDisplay.classList.remove('hidden');
  if (wrongIndexes.length === 0) {
    launchFireworks();
  } else if (wrongIndexes.length > 2) {
    setTimeout(() => triggerJumpscare('SAI TRÊN 2 CÂU RỒI! LÀM LẠI CHO CHẮC NHA!', '🙀'), 420);
  }
  document.getElementById('answerKey').classList.add('hidden');
  renderWrongReview(wrongIndexes);
  renderTeacherEssayView(collectCurrentWork());
  document.getElementById('submitArea').classList.remove('hidden');
  document.getElementById('resetArea').classList.remove('hidden');
  saveCurrentWork(false);
  window.scrollTo({top: scoreDisplay.offsetTop - 20, behavior:'smooth'});
}
function renderAnswerKey(){
  const key = document.getElementById('answerKey');
  if (key) key.classList.add('hidden');
}


document.addEventListener('focusin', function(e){
  if (e.target && e.target.classList && e.target.classList.contains('math-work-editor')) {
    activeMathEditor = e.target;
  }
}, true);
document.addEventListener('click', function(e){
  if (e.target && e.target.closest) {
    const editor = e.target.closest('.math-work-editor');
    if (editor) activeMathEditor = editor;
  }
}, true);
document.addEventListener('dblclick', function(e){
  const fracEl = e.target && e.target.closest ? e.target.closest('.input-frac') : null;
  if (fracEl) {
    e.preventDefault();
    editInsertedFraction(fracEl);
  }
}, true);
document.addEventListener('keydown', function(e){
  const editor = e.target && e.target.classList && e.target.classList.contains('math-work-editor') ? e.target : null;
  if (!editor) return;
  if (e.key === 'Enter') {
    e.preventDefault();
    const step = editor.closest('.solution-step');
    const answer = editor.closest('.answer-step');
    if (step) {
      const box = step.closest('.solution-paper').querySelector('.solution-steps');
      const essayIdx = Number(box.id.replace('essaySteps',''));
      addEssayStepBlock(essayIdx);
      focusLastMathEditorInStep(essayIdx);
    } else if (answer) {
      const box = answer.closest('.answer-list');
      const essayIdx = Number(box.id.replace('essayAnswers',''));
      addEssayAnswerBlock(essayIdx);
      focusLastAnswerEditor(essayIdx);
    }
    scheduleSave();
  }
}, true);
window.addEventListener('beforeunload', () => saveCurrentWork(false));
document.addEventListener('input', function(e){
  if (e.target && e.target.closest && e.target.closest('#viewExam')) scheduleSave();
}, true);
document.addEventListener('change', function(e){
  if (e.target && e.target.matches && e.target.matches('input[type="radio"]')) {
    const block = e.target.closest('.mcq-block');
    if (block) {
      block.classList.remove('needs-redo');
      block.querySelectorAll('.option').forEach(o => o.classList.remove('wrong','missing','correct','locked-correct'));
    }
  }
  if (e.target && e.target.closest && e.target.closest('#viewExam')) scheduleSave();
}, true);

function buildExam(grade, test){
  const g = String(grade);
  const t = String(test);
  const exam = NEW_QUESTION_BANK[g] && NEW_QUESTION_BANK[g][t];
  if (!exam) return {questions: [], essays: []};
  return {
    title: exam.title || `Đề ${test}`,
    questions: (exam.questions || []).map(q => ({text:q.text||'',choices:q.choices||[],answer:Number(q.answer||0),explain:q.explain||''})),
    essays: (exam.essays || []).map(e => ({type:e.type||'word',prompt:e.prompt||'',solution:e.solution||''}))
  };
}

// Kiểm tra nhanh dữ liệu khi mở trang.
(function init(){
  const report = [];
  [4,5].forEach(g => {
    for (let t=1;t<=6;t++) {
      const e = buildExam(g,t);
      report.push(`Lớp ${g} đề ${t}: ${e.questions.length} câu, ${e.essays.length} bài tự luận`);
      if (e.questions.length !== 25) console.warn('Số câu chưa đúng', g, t, e.questions.length);
      if (!e.essays || e.essays.length !== 3) console.warn('Số bài giải chưa đúng', g, t, e.essays && e.essays.length);
    }
  });
  console.log(report.join('\n'));
  updateNavLabel('landing');
})();
</script>

<script id="reset-scare-upgrade-script">
(function(){
  if (window.__resetScareUpgradeInstalled) return;
  window.__resetScareUpgradeInstalled = true;

  function getCurrentGradeSafe(){ try { return (typeof currentGrade !== 'undefined') ? currentGrade : window.currentGrade; } catch(err) { return window.currentGrade; } }
  function getCurrentTestSafe(){ try { return (typeof currentTest !== 'undefined') ? currentTest : window.currentTest; } catch(err) { return window.currentTest; } }
  function getScareTimersSafe(){ try { return (typeof scareTimers !== 'undefined') ? scareTimers : (window.scareTimers = window.scareTimers || []); } catch(err) { return (window.scareTimers = window.scareTimers || []); } }

  const SCARY_SET = [
    {emoji:'👹', text:'Ú ÒA! TẬP TRUNG LẠI NÀO!'},
    {emoji:'💀', text:'SAI LÀ BỊ HÙ ĐÓ NHA!'},
    {emoji:'🧟', text:'BÀI TOÁN ĐANG NHÌN EM KÌA!'},
    {emoji:'🕷️', text:'CẨN THẬN! CÓ CÂU BỊ NHẦM RỒI!'},
    {emoji:'😈', text:'LÀM CHẬM LÀ MA TOÁN XUẤT HIỆN!'},
    {emoji:'🦇', text:'BÓNG ĐÊM GỌI TÊN CÂU SAI!'}
  ];
  const TEASE_SET = [
    {emoji:'🤡', text:'LÊU LÊU! CÂU NÀY MÀ CŨNG NHẦM SAO?'},
    {emoji:'🐵', text:'ÚI CHÀ! NÃO ĐANG ĐI CHƠI HẢ?'},
    {emoji:'👻', text:'HÚ HỒN CHƯA? LÀM LẠI CHO CHẮC NHA!'},
    {emoji:'😜', text:'ỦA RỒI TÍNH KIỂU GÌ VẬY TA?'},
    {emoji:'🙀', text:'MÈO TOÁN HẾT HỒN VÌ CÂU SAI!'},
    {emoji:'🐸', text:'ẾCH CŨNG BIẾT LÀ PHẢI KIỂM TRA LẠI!'}
  ];
  const TIME_SET = [
    {emoji:'⏰', text:'HẾT 1 PHÚT 30 GIÂY RỒI, TẬP TRUNG NHA!'},
    {emoji:'👀', text:'ĐỒNG HỒ ĐANG NHÌN EM ĐÓ!'},
    {emoji:'🧠', text:'BẬT NÃO TOÁN LÊN NÀO!'},
    {emoji:'⚡', text:'NHANH LÊN! ĐỪNG ĐỂ CÂU HỎI CHỜ!'}
  ];
  const OVER_SET = [
    {emoji:'😱', text:'QUÁ 20 PHÚT RỒI! KIỂM TRA LẠI BÀI NGAY!'},
    {emoji:'🧟', text:'LÀM LÂU QUÁ, MA THỜI GIAN TỚI RỒI!'},
    {emoji:'⌛', text:'CÁT THỜI GIAN SẮP HẾT RỒI ĐÓ!'}
  ];

  function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
  function toast(msg){
    try {
      const old = document.querySelector('.reset-confirm-flash');
      if (old) old.remove();
      const el = document.createElement('div');
      el.className = 'reset-confirm-flash';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1500);
    } catch (err) {}
  }

  window.triggerJumpscare = function(reasonText, emoji, mode){
    const overlay = document.getElementById('scareOverlay');
    if (!overlay) return;
    if (window.scareActive) return;
    let item;
    let finalMode = mode || 'scary';
    const reason = String(reasonText || '').toLowerCase();
    if (mode === 'tease' || reason.includes('sai') || reason.includes('nhầm')) { item = pick(Math.random() < .55 ? TEASE_SET : SCARY_SET); finalMode = Math.random() < .55 ? 'tease' : 'scary'; }
    else if (mode === 'time' || reason.includes('1 phút') || reason.includes('90')) { item = pick(TIME_SET); finalMode = 'time'; }
    else if (mode === 'over' || reason.includes('20 phút')) { item = pick(OVER_SET); finalMode = 'scary'; }
    else { item = pick(Math.random() < .45 ? TEASE_SET : SCARY_SET); finalMode = Math.random() < .45 ? 'tease' : 'scary'; }
    if (reasonText && !emoji) item.text = reasonText;
    if (reasonText && emoji) item = {text: reasonText, emoji};

    const face = document.getElementById('scareFace');
    const text = document.getElementById('scareText');
    overlay.classList.remove('tease','time','scary');
    overlay.classList.add(finalMode);
    if (face) face.textContent = item.emoji;
    if (text) text.textContent = item.text;
    window.scareActive = true;
    overlay.classList.add('active');
    const duration = finalMode === 'tease' ? 4200 : 5200;
    clearTimeout(window.__scareHideTimer);
    window.__scareHideTimer = setTimeout(() => {
      overlay.classList.remove('active','tease','time','scary');
      window.scareActive = false;
    }, duration);
  };
  window.triggerRandomScare = function(mode){
    if (mode === 'time90') return window.triggerJumpscare('', '', 'time');
    if (mode === 'overtime') return window.triggerJumpscare('', '', 'over');
    if (mode === 'wrong') return window.triggerJumpscare('', '', Math.random() < .5 ? 'tease' : 'scary');
    return window.triggerJumpscare('', '', mode || 'scary');
  };

  const oldStartTimers = window.startExamTimers;
  window.startExamTimers = function(){
    if (typeof window.clearExamTimers === 'function') window.clearExamTimers();
    window.examStartedAt = Date.now();
    const timers = getScareTimersSafe();
    timers.push(setTimeout(() => {
      const exam = document.getElementById('viewExam');
      if (getCurrentGradeSafe() && getCurrentTestSafe() && exam && !exam.classList.contains('hidden')) window.triggerRandomScare('time90');
    }, 90 * 1000));
    timers.push(setTimeout(() => {
      const exam = document.getElementById('viewExam');
      if (getCurrentGradeSafe() && getCurrentTestSafe() && exam && !exam.classList.contains('hidden')) window.triggerRandomScare('overtime');
    }, 20 * 60 * 1000));
  };

  window.resetCurrentExam = function(){
    const pass = prompt('Nhập mật khẩu RESET để xóa bài làm và làm lại từ đầu:');
    if (pass === null) return;
    if (String(pass).trim() !== 'RESET') {
      alert('Sai mật khẩu reset. Mật khẩu đúng là RESET.');
      return;
    }

    try {
      const exactKey = (typeof getSaveKey === 'function') ? getSaveKey() : '';
      if (exactKey) localStorage.removeItem(exactKey);
      const currentTokens = [String(getCurrentGradeSafe() || ''), String(getCurrentTestSafe() || '')].filter(Boolean);
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const key = localStorage.key(i) || '';
        const looksLikeThisApp = key.includes('math-only-save') || key.includes('DeThiToan') || key.includes('Toan') || key.includes('luyenTap');
        const looksLikeThisExam = !currentTokens.length || currentTokens.every(t => key.includes(t)) || key === exactKey;
        if (looksLikeThisApp && looksLikeThisExam) localStorage.removeItem(key);
      }
    } catch (err) {}

    try { if (typeof autoSaveTimer !== 'undefined') clearTimeout(autoSaveTimer); else clearTimeout(window.autoSaveTimer); } catch (err) {}
    try { if (typeof lastGradedWrongIndexes !== 'undefined' && Array.isArray(lastGradedWrongIndexes)) lastGradedWrongIndexes.length = 0; } catch(err) {}

    try {
      if (typeof window.clearGradingVisuals === 'function') window.clearGradingVisuals();
      if (typeof window.renderExam === 'function') window.renderExam();
      document.querySelectorAll('#examRoot input[type="radio"]').forEach(r => { r.checked = false; r.disabled = false; });
      document.querySelectorAll('#examRoot input[type="text"], #examRoot textarea').forEach(inp => { inp.value = ''; inp.disabled = false; });
      document.querySelectorAll('#examRoot .option').forEach(o => o.classList.remove('correct','wrong','missing','selected','locked-correct'));
      document.querySelectorAll('#examRoot .mcq-block').forEach(b => b.classList.remove('needs-redo','done-correct'));
      if (typeof window.resetEssayToBlank === 'function') window.resetEssayToBlank();
    } catch (err) {
      console.warn('Reset UI fallback:', err);
    }

    ['scoreDisplay','wrongReview','teacherEssayView','answerKey'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.add('hidden');
      if (id !== 'answerKey') el.innerHTML = '';
    });
    const submit = document.getElementById('submitArea');
    const reset = document.getElementById('resetArea');
    if (submit) submit.classList.remove('hidden');
    if (reset) reset.classList.remove('hidden');
    try { if (typeof window.saveCurrentWork === 'function') window.saveCurrentWork(false); } catch (err) {}
    toast('🔄 Đã reset bài làm. Bắt đầu lại từ đầu!');
    try { window.scrollTo({top:0, behavior:'smooth'}); } catch (err) {}
  };
  window.promptReset = window.resetCurrentExam;

  const oldGradeExam = window.gradeExam;
  if (typeof oldGradeExam === 'function') {
    window.gradeExam = function(){
      const result = oldGradeExam.apply(this, arguments);
      setTimeout(() => {
        try {
          let wrong = document.querySelectorAll('.mcq-block.needs-redo').length;
          try { if (typeof lastGradedWrongIndexes !== 'undefined' && Array.isArray(lastGradedWrongIndexes)) wrong = lastGradedWrongIndexes.length; } catch(err) {}
          if (wrong > 2) window.triggerRandomScare('wrong');
        } catch (err) {}
      }, 650);
      return result;
    };
  }
})();
</script>
